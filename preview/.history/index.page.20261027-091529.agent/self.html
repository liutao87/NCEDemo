  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Segmented 组件样式（占位，待填充 token 映射） */
.ant-segmented {
  border-radius: var(--radius-md);
  padding: 0.125rem;
  background: var(--color-fill);
  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级基础样式 — 页面骨架（头部 + 主体[侧边菜单 + 内容区]） */
.app-root {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
}


/* 头部导航:高 3rem,左右两端对齐,垂直居中;左内边距 2rem,右内边距 1rem */
.header-bar {
  flex: 0 0 3rem;
  height: 3rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 2rem;
  padding-right: 1rem;
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
}

.header-left {
  display: flex;
  align-items: center;
}

/* 纯图标按钮统一形态 */
.header-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: none;
  border-radius: var(--radius-base);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s ease, background-color 0.15s ease;
}

.header-icon-btn:hover {
  color: var(--primary);
  background: var(--surface-variant);
}

/* 品牌区:logo 距导航栏图标 1.5rem */
.header-brand {
  display: flex;
  align-items: center;
  margin-left: 1.5rem;
}

.header-logo {
  display: block;
  width: 1.5rem;
  height: 1.5rem;
}

.header-title {
  margin-left: 0.5rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

/* 右侧工具区 */
.header-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
}

.header-account {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-full);
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s ease, background-color 0.15s ease;
}

.header-account:hover {
  color: var(--primary);
  background: var(--surface-variant);
}

.header-account-name {
  font: var(--font-body-m);
  color: inherit;
  white-space: nowrap;
}


/* 侧边菜单:收起 3rem / 展开 16rem,宽度过渡实现抽屉式伸缩 */
.side-menu {
  flex: 0 0 auto;
  width: 16rem;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  border-right: 1px solid var(--divider);
  overflow: hidden;
  transition: width 0.25s ease;
}

.side-menu.is-collapsed {
  width: 3rem;
}

/* 底部伸缩按钮:3rem × 3rem,图标 1rem × 1rem,水平垂直居中,距底部 1rem */
.side-menu-toggle {
  flex: 0 0 auto;
  width: 3rem;
  height: 3rem;
  margin: 0 auto 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  border-radius: var(--radius-base);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s ease, background-color 0.15s ease;
}

.side-menu-toggle:hover {
  color: var(--primary);
  background: var(--surface-variant);
}


/* 菜单内容区:占据剩余宽度,独立滚动 */
.content-area {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 1.5rem;
  background: var(--surface-container-lowest);
}

/* 首页态:左侧会话卡片贴边占满,右侧地图区域自适应 */
.content-area.is-overview {
  display: flex;
  padding: 0;
  overflow: hidden;
}

.overview-aside {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  overflow: hidden;
}


/* 会话卡片:总览核心区左侧面板(540px × 100%)
   结构:session-main(背景图区域,32px 内边距) + session-composer(输入框,无背景图) */
.session-card {
  flex: 0 0 33.75rem; /* 540px */
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--on-surface);
  background: var(--surface-container-lowest);
}

/* ---------- 背景图区域(不含底部输入框) ---------- */
.session-main {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 2rem; /* 上下左右 32px */
  background-color: var(--surface-container-high);
  background-image: url("./assets/uploads/bg-1.png");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* 深色主题:浅色背景图上叠深色蒙层,保证白色标题/正文可读 */
.dark .session-card .session-main {
  background-image: linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
    url("./assets/uploads/bg-1.png");
}

/* ---------- 区域一:标题 + 时间范围下拉 ---------- */
.session-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.session-title {
  margin: 0;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.range-select {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* ---------- 区域二:守护概览(左文本 + 右图片) ---------- */
.session-hero {
  flex-shrink: 0;
  margin-top: 3.9375rem; /* 标题下 63px */
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.session-hero-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.hero-title {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.hero-num {
  font-style: normal;
  font-weight: var(--font-weight-bold);
  color: var(--success);
}

.hero-line {
  margin: 0.78125rem 0 0; /* 标题下 12.5px */
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.hero-line + .hero-line {
  margin-top: 0.25rem; /* 行间 4px */
}

.hero-strong {
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.hero-art {
  flex: 0 0 auto;
  width: 5.9375rem; /* 95px */
  height: 5.3125rem; /* 85px */
  margin-right: 0.8125rem; /* 额外 13px,与区域外缘合计 45px */
  object-fit: contain; /* 任意比例图片均不拉伸变形 */
}

/* ---------- 区域三:左右指标小卡片 ---------- */
.session-metrics {
  flex-shrink: 0;
  margin-top: 1.6875rem; /* 27px */
  display: flex;
  gap: 0.5rem; /* 8px */
}

.metric-card {
  flex: 1 1 0;
  min-width: 0;
  padding: 1rem; /* 16px */
  border-radius: 0.75rem; /* 12px */
  background: rgba(255, 255, 255, 0.72);
}

.dark .session-card .metric-card {
  background: rgba(28, 28, 30, 0.72);
}

.metric-head {
  display: flex;
  align-items: center;
  gap: 0.5rem; /* 图标距标题 8px */
}

.metric-icon {
  display: inline-flex;
  flex-shrink: 0;
}

.metric-icon.is-fault {
  color: var(--error);
}

.metric-icon.is-network {
  color: var(--info);
}

.metric-title {
  min-width: 0;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.metric-value {
  margin-top: 0.75rem; /* 12px */
  font-size: var(--font-size-3xl); /* 24px */
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-xs);
  color: var(--on-surface);
}

.metric-label {
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* ---------- 区域四:待您关注 ---------- */
.session-attention {
  margin-top: 1.5rem; /* 24px */
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.attention-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.attention-title {
  margin: 0;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.attention-more {
  font: var(--font-body-s);
  color: var(--interactive-link);
  text-decoration: none;
  cursor: pointer;
}

.attention-more:hover {
  color: var(--interactive-link-hover);
}

/* 胶囊形 tab:平分宽度,整体与单项均为椭圆 */
.pill-tabs {
  flex-shrink: 0;
  margin-top: 1.25rem; /* 20px */
  display: flex;
  gap: 0.25rem;
  padding: 0.25rem;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.5);
}

.dark .session-card .pill-tabs {
  background: rgba(20, 20, 20, 0.45);
}

.pill-tab {
  flex: 1 1 0;
  min-width: 0;
  height: 2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.1875rem;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.pill-tab:hover {
  color: var(--on-surface);
}

.pill-tab.is-active {
  background: var(--surface-container-highest);
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
  box-shadow: var(--shadow-sm);
}

.pill-count {
  font-weight: var(--font-weight-semibold);
}

/* 数据列表:超出显示细小滚动条 */
.attention-list {
  margin-top: 0.9375rem; /* 15px */
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
  padding-right: 0.25rem;
}

.attention-list::-webkit-scrollbar {
  width: 0.25rem;
}

.attention-list::-webkit-scrollbar-thumb {
  background: rgba(25, 25, 25, 0.18);
  border-radius: var(--radius-full);
}

.dark .session-card .attention-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.22);
}

.attention-card {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem; /* 图标距文本 12px */
  padding: 1rem; /* 16px */
  border-radius: 0.75rem; /* 12px */
  background: rgba(255, 255, 255, 0.9);
}

.dark .session-card .attention-card {
  background: rgba(30, 30, 32, 0.88);
}

.attention-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.625rem; /* 26px */
  height: 1.625rem;
}

.attention-icon.is-fault {
  color: var(--error);
}

.attention-icon.is-network {
  color: var(--info);
}

.attention-body {
  flex: 1 1 0;
  min-width: 0;
}

.attention-card-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.attention-card-desc {
  margin-top: 0.25rem; /* 4px */
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  line-height: var(--line-height-md);
  word-break: break-all;
}

/* ---------- 底部 AI 输入框(背景图区域内,边距由 session-main 的 32px 内边距提供) ---------- */
.session-composer {
  flex-shrink: 0;
  margin-top: 1rem;
}

.composer-frame {
  box-sizing: border-box;
  width: 100%;
  padding: 0.09375rem; /* 1.5px 渐变彩边 */
  border: none;
  border-radius: 1.5rem; /* 24px */
  text-align: left;
  background: linear-gradient(120deg, #7c3aed, #2563eb, #06b6d4, #8b5cf6, #7c3aed);
  background-size: 300% 300%;
  animation: ai-flow 8s ease infinite;
}

@keyframes ai-flow {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.composer-frame.is-small {
  display: block;
  cursor: text;
}

.composer-frame.is-small:focus-visible {
  outline: var(--focus-ring) solid var(--outline-width-focus);
  outline-offset: var(--outline-offset-gap);
}

.composer-inner {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  height: 3rem; /* 初始 48px */
  padding: 0 0.75rem 0 1.25rem;
  border-radius: 1.40625rem;
  background: var(--surface-container-highest);
}

.composer-frame.is-big .composer-inner {
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  height: 7.5rem; /* 展开后 120px */
  padding: 0.75rem 0.625rem 0.5rem 1rem;
}

.composer-placeholder {
  flex: 1 1 0;
  min-width: 0;
  font: var(--font-body-m);
  color: var(--text-placeholder);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.composer-send-mini {
  flex: 0 0 auto;
  display: inline-flex;
  color: var(--primary);
}

.composer-input {
  flex: 1 1 0;
  min-height: 0;
}

.composer-input textarea {
  height: 100% !important;
  padding: 0;
  resize: none;
  font: var(--font-body-m);
  color: var(--on-surface);
}

.composer-toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.composer-tools-left {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  min-width: 0;
}

.composer-tools-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}

.scene-select {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.scene-label {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  height: 1.75rem;
  padding: 0 1.125rem;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  cursor: pointer;
  user-select: none;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.tool-btn:hover {
  color: var(--on-surface);
}

.tool-btn.is-active {
  background: var(--primary-container);
  color: var(--primary);
}

.tool-btn-text {
  max-width: 14rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tool-btn-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 0.125rem;
  border-radius: var(--radius-full);
  cursor: pointer;
}

.tool-btn-clear:hover {
  color: var(--error);
}

.word-count {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.icon-tool {
  width: 2rem;
  height: 2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.icon-tool:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.send-btn {
  width: 2rem;
  height: 2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  color: var(--text-disabled);
  cursor: not-allowed;
}

.send-btn.is-active {
  background: linear-gradient(135deg, #7c3aed, #06b6d4);
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 0 0.5rem rgba(124, 58, 237, 0.4);
}

.composer-hint {
  margin-top: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* ---------- 深色输入框:场景下拉与模板库按钮统一胶囊圆角 + 白色系描边 ----------
   覆盖 AI 面板(永久深色)与首页(深色应用下),两个输入框样式一致 */
.ai-chat .composer-tools-left .tool-btn,
.dark .session-card .composer-tools-left .tool-btn {
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.06);
  color: rgba(255, 255, 255, 0.85);
}

.ai-chat .composer-tools-left .tool-btn:hover,
.dark .session-card .composer-tools-left .tool-btn:hover {
  border-color: rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
}

/* 场景下拉 Select(borderless 变体):补胶囊圆角 + 白色描边,与模板库按钮对齐 */
.ai-chat .scene-select .ant-select-selector,
.dark .session-card .scene-select .ant-select-selector {
  height: 1.75rem !important;
  min-height: 1.75rem !important;
  padding: 0 0.875rem !important;
  border: 1px solid rgba(255, 255, 255, 0.25) !important;
  border-radius: var(--radius-full) !important;
  background: rgba(255, 255, 255, 0.06) !important;
  color: rgba(255, 255, 255, 0.85) !important;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.ai-chat .scene-select .ant-select-selector:hover,
.dark .session-card .scene-select .ant-select-selector:hover {
  border-color: rgba(255, 255, 255, 0.45) !important;
  background: rgba(255, 255, 255, 0.12) !important;
}

.ai-chat .scene-select .ant-select-selection-item,
.dark .session-card .scene-select .ant-select-selection-item {
  color: rgba(255, 255, 255, 0.85) !important;
  line-height: 1.5rem;
}

.ai-chat .scene-select .ant-select-arrow,
.dark .session-card .scene-select .ant-select-arrow {
  color: rgba(255, 255, 255, 0.55);
}

/* ---------- 模板库浮层弹窗(354px 高,明暗主题适配) ---------- */
.ant-popover.tpl-popover .ant-popover-inner {
  padding: 0.75rem;
  border-radius: 0.75rem;
  background: var(--surface-container-high);
  box-shadow: var(--shadow-popover);
  color: var(--on-surface);
}

.dark .ant-popover.tpl-popover .ant-popover-inner {
  background: var(--surface-container-high);
  color: var(--on-surface);
}

.tpl-popover .ant-popover-inner-content {
  padding: 0;
}

.tpl-panel {
  width: 18.75rem;
  height: 22.125rem; /* 354px */
  display: flex;
  flex-direction: column;
}

.tpl-title {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.tpl-tabs {
  margin-top: 0.625rem;
  display: flex;
  gap: 1rem;
  padding-bottom: 0.375rem;
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.tpl-tab {
  padding: 0.25rem 0;
  border: none;
  background: transparent;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  cursor: pointer;
}

.tpl-tab.is-active {
  color: var(--primary);
  font-weight: var(--font-weight-medium);
  box-shadow: inset 0 -0.125rem 0 0 var(--primary);
}

.tpl-list {
  margin-top: 0.625rem;
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.625rem; /* 10px */
  padding-right: 0.125rem;
}

.tpl-list::-webkit-scrollbar {
  width: 0.25rem;
}

.tpl-list::-webkit-scrollbar-thumb {
  background: rgba(25, 25, 25, 0.18);
  border-radius: var(--radius-full);
}

.dark .tpl-panel .tpl-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.22);
}

.tpl-item {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  height: 2.5rem; /* 40px */
  padding: 0 0.75rem;
  border: none;
  border-radius: 0.5rem; /* 8px */
  background: var(--surface-variant);
  color: var(--on-surface);
  font: var(--font-body-m);
  cursor: pointer;
  text-align: left;
}

.tpl-item:hover {
  background: var(--primary-container);
}

.tpl-item.is-active {
  background: var(--primary-container);
  color: var(--primary);
  font-weight: var(--font-weight-medium);
}

.tpl-name {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* 首页右侧:地图直接铺满(无 padding) + 顶部"数据总览"浮层卡片 */
.overview-view {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  position: relative; /* 卡片浮层定位基准 */
}

.map-body {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
}

/* ---------- 数据总览浮层卡片(绝对定位悬浮于地图上方) ---------- */
.data-overview-card {
  position: absolute;
  top: 1.5rem;
  left: 2rem;
  right: 2rem; /* 左右外间距 2rem,宽度占满剩余 */
  z-index: 2;
  background: rgba(119, 119, 119, 0.25);
  backdrop-filter: blur(12px); /* 毛玻璃 */
  -webkit-backdrop-filter: blur(12px);
  border-radius: 1rem;
  padding: 1rem 1.5rem 1.5rem; /* 上 1rem,左右 1.5rem,下 1.5rem */
  pointer-events: none; /* 不阻挡地图拖拽/缩放 */
}

.doc-title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.875rem;
  color: #FFFFFF;
}

/* 信息内容:标题下 0.25rem,左右均分 + 中间分割线,垂直居中 */
.doc-body {
  margin-top: 0.25rem;
  display: flex;
  align-items: center;
}

.doc-half {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
}

/* 子块:第一块内容撑开,第二块占满剩余宽度 */
.doc-stat {
  flex: 0 0 auto;
  min-width: 0;
}

.doc-stat-fill {
  flex: 1 1 0;
}

/* 分割线:1px 宽,3rem 高,两边 1.5rem 间距 */
.doc-divider {
  flex: 0 0 auto;
  width: 1px;
  height: 3rem;
  margin: 0 1.5rem;
  background: rgba(243, 243, 243, 0.1);
}

/* ---------- 单个指标块(上下布局) ---------- */
.stat-block {
  display: flex;
  flex-direction: column;
}

.stat-num {
  display: flex;
  align-items: baseline; /* 大小数字底部对齐 */
}

.stat-num-main {
  font-size: 2rem;
  line-height: 2.5rem;
  color: #FFFFFF;
}

.stat-num-sub {
  font-size: 0.875rem;
  line-height: 1.625rem;
  color: rgb(201, 201, 201);
}

.stat-desc {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.75rem;
  line-height: 1.25rem;
  color: rgb(147, 147, 147);
}

.stat-desc-text {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- A2:DC 配置变更推荐次数 ---------- */
.dc-block {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.dc-title {
  font-size: 0.75rem;
  line-height: 0.75rem;
  color: rgb(147, 147, 147);
}

/* 三组并排,间距 1.5rem */
.dc-items {
  margin: 0.25rem 0;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.dc-item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.dc-num {
  font-size: 1.5rem;
  line-height: 2rem;
  color: #FFFFFF;
}

/* 带背景小圆 + 文本,间隙 0.25rem */
.dc-label {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.dc-dot {
  flex: 0 0 auto;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
}

.dc-text {
  font-size: 0.75rem;
  line-height: 1.25rem;
  color: rgb(201, 201, 201);
}

/* 底部分段进度条:在 dc-items(父容器)之下,无上间距,三段按比例占满,段间 0.25rem 间距 */
.dc-bar {
  display: flex;
  gap: 0.25rem;
  height: 0.25rem;
  border-radius: 9999px;
  background: rgba(243, 243, 243, 0.1);
  overflow: hidden;
}

.dc-bar-seg {
  display: block;
  height: 100%;
  flex: 1 0 0; /* grow 按数据比例由 inline style 覆盖 */
}

/* ---------- B2:指标块 + 圆环图(左右布局,间距 1.5rem) ---------- */
.b2-row {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  min-width: 0;
}

.b2-stat {
  flex: 0 0 auto;
  min-width: 0;
}

.ring-wrap {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.ring-svg {
  flex: 0 0 auto;
  width: 4rem;
  height: 4rem;
}

.ring-legend {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.ring-legend-item {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.75rem;
  line-height: 1.25rem;
  color: rgb(201, 201, 201);
}

.ring-dot {
  flex: 0 0 auto;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
}


/* 中国地图:canvas 绘制,填满父容器 */
/* 地图专属配色:浅色基础值,暗色经 .dark 后代覆盖(单轨换肤,canvas 侧按变量读取) */
.china-map {
  --map-fill: #F0F0F0;      /* 省份区域填充(地图背景色) */
  --map-line: #D9D9D9;      /* 省界线(细,浅色) */
  --map-text: #595959;      /* 省份文本(大/中省) */
  --map-text-sub: #8C8C8C;  /* 省份文本(小省/港澳) */
  --map-link: #08A471;      /* 标注点/连线/logo(浅/暗同色) */
  --map-stripe: #202020;    /* 背景斜条纹(浅/暗同色) */
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.dark .china-map {
  --map-fill: #363636;
  --map-line: #808080;
  --map-text: #969696;
  --map-text-sub: #6E6E6E;
}

.china-map-canvas {
  display: block;
  cursor: grab; /* 可拖拽 */
}

/* 右下角视图控制:放大/缩小连体(分割线隔开) + 居中独立(竖排,位于南海附图上方) */
.map-controls {
  position: absolute;
  right: 1rem;
  bottom: 5rem; /* 附图(64px) + 底边距(10px) + 间隙 */
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 2;
}

/* 放大+缩小组合:连在一起,中间分割线,毛玻璃 */
.map-zoom-group {
  border-radius: var(--radius-md);
  background: rgba(243, 243, 243, 0.1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
}

.map-zoom-group .map-ctl-btn {
  border-radius: 0;
  background: transparent; /* 毛玻璃由组合容器提供 */
}

.map-zoom-group .map-ctl-btn + .map-ctl-btn {
  border-top: 1px solid rgba(243, 243, 243, 0.2); /* 分割线 */
}

.map-ctl-btn {
  width: 2rem;
  height: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: rgba(243, 243, 243, 0.1);
  color: var(--on-surface);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.map-ctl-btn.is-single {
  border-radius: var(--radius-md);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.map-ctl-btn:hover {
  background: rgba(243, 243, 243, 0.22);
  color: var(--on-surface);
}

/* 枢纽叠加层:logo 圆 + 名称,绝对定位对准 canvas 投影点 */
.map-hub {
  position: absolute;
  transform: translate(-50%, -50%); /* logo 圆心对准投影点 */
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

.map-hub-logo {
  width: 3rem;
  height: 3rem;
  border-radius: 50%;
  background: var(--map-link); /* #06A46F */
  display: flex;
  align-items: center;
  justify-content: center;
}

.map-hub-label {
  margin-top: 0.75rem;
  font: var(--font-caption-m);
  color: #FFFFFF;
  white-space: nowrap;
  /* 浅色地图上保证白字可读 */
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 0 4px rgba(0, 0, 0, 0.35);
}


/* AI 会话:左侧 540px × 100% 面板(导航栏 + 居中欢迎内容 + AI 输入框) */
.ai-chat {
  flex: 0 0 33.75rem; /* 540px */
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--on-surface);
  background: var(--surface-container-lowest);
  border-right: var(--border-width-thin) solid var(--divider);
}

/* ---------- AI 面板固定深色皮肤(应用浅色/深色下均为深色) ----------
   根节点自带 .dark 类 → dark.css 的 --color-* 深色值在本域生效;
   此处补齐 theme.css 语义令牌的本域映射(令牌在 :root 处求值,需局部重声明),
   使面板内自绘样式(气泡/卡片/输入框/思考区等)同步走深色 */
.ai-chat.dark {
  --primary: var(--color-brand);
  --on-primary: var(--color-text-inverse);
  --primary-hover: var(--color-brand-hover);
  --primary-active: var(--color-brand-active);
  --primary-container: var(--color-info-primary-subtler);
  --on-primary-container: var(--color-text-primary);
  --surface: var(--color-bg-1);
  --on-surface: var(--color-text-primary);
  --surface-variant: var(--color-bg-4);
  --on-surface-variant: var(--color-text-secondary);
  --surface-container-lowest: var(--color-bg-1); /* 面板底 */
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-3); /* 回答/欢迎/输入卡片 */
  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --divider: var(--color-border-separator);
  --outline: var(--color-border);
  --focus-ring: var(--color-border-focus);
  --interactive-link: var(--color-link);
  --success: var(--color-success);
  --error: var(--color-error);
  --info: var(--color-info-primary);
}

/* ---------- 顶部导航栏(50px) ---------- */
.ai-nav {
  flex-shrink: 0;
  height: 3.125rem; /* 50px */
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
}

.ai-nav-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.ai-nav-btn {
  width: 2rem;
  height: 2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.ai-nav-btn:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.ai-nav-title {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 会话中心:水平垂直居中 ---------- */
.ai-center {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem 0;
}

.ai-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.ai-gem {
  width: 3.75rem; /* 60px */
  height: 3.75rem;
}

.ai-brand-name {
  font-size: var(--font-size-3xl); /* 24px */
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-xs);
  color: var(--on-surface);
}

.ai-intro {
  margin: 1.5rem 0 0; /* 24px */
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}

/* 信息区域:左文案 | 右刷新+换一批,两端对齐 */
.ai-scene-bar {
  margin-top: 2.25rem; /* 36px */
  width: 26.25rem; /* 420px */
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.ai-scene-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.ai-refresh {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0;
  border: none;
  background: transparent;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  cursor: pointer;
}

.ai-refresh:hover {
  color: var(--primary);
}

/* ---------- 三张场景卡片(420px × 72px, 间距8px, 圆角16px) ---------- */
.ai-cards {
  margin-top: 1rem; /* 16px */
  width: 26.25rem; /* 420px */
  display: flex;
  flex-direction: column;
  gap: 0.5rem; /* 8px */
}

.ai-card {
  height: 4.5rem; /* 72px */
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0 1rem;
  border-radius: 1rem; /* 16px */
  background: var(--surface-container-highest); /* 浅色白卡 */
  box-shadow: var(--shadow-md); /* 增强阴影,浅色下轮廓清晰 */
  transition: box-shadow 0.2s ease, background 0.2s ease;
}

.ai-card:hover {
  box-shadow: var(--shadow-lg);
}

/* 暗色:提亮卡片背景与纯黑区域拉开对比,阴影改为 hover 提亮 */
.dark .ai-chat .ai-card {
  background: var(--color-bg-3);
  box-shadow: none;
}

.dark .ai-chat .ai-card:hover {
  background: var(--color-bg-4);
  box-shadow: none;
}

/* 暗色:导航按钮 hover 背景(默认 token 在暗色下不可见) */
.dark .ai-chat .ai-nav-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

.ai-card-icon {
  flex: 0 0 auto;
  display: inline-flex;
  color: var(--primary);
}

.ai-card-body {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.ai-card-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.ai-card-desc {
  margin-top: 0.125rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 底部 AI 输入框(复用 Composer,左右/底部留白 32px) ---------- */
.ai-chat .session-composer {
  padding: 0 2rem 2rem;
}

/* ==================================================================
   对话流(发送后):时间 + 用户蓝色卡片(三圆角) + AI 回答卡片
   ================================================================== */

/* ---------- 对话流滚动容器 ---------- */
.ai-thread {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  padding: 1rem 2rem;
}

.ai-thread::-webkit-scrollbar {
  width: 0.25rem;
}

.ai-thread::-webkit-scrollbar-thumb {
  background: rgba(25, 25, 25, 0.18);
  border-radius: var(--radius-full);
}

.dark .ai-chat .ai-thread::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.22);
}

/* 每组问答 */
.ai-exchange {
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

/* 顶部居中的本次对话时间 */
.ai-chat-time {
  text-align: center;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* 用户输入卡片:蓝色背景、右上角小圆角其余三圆角、靠右、宽于回答卡片略窄 */
.ai-msg-user {
  align-self: flex-end;
  max-width: 88%;
  padding: 0.625rem 0.875rem;
  border-radius: 0.75rem 0.25rem 0.75rem 0.75rem; /* 三个大圆角 + 右上小圆角 */
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: var(--on-primary);
  font: var(--font-body-m);
  line-height: var(--line-height-md);
  word-break: break-word;
  white-space: pre-wrap;
  box-shadow: var(--shadow-sm);
  animation: msg-in 0.3s ease-out;
}

/* ---------- AI 回答卡片(整卡,占满对话区宽度) ---------- */
.answer-card {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.875rem 1rem;
  border-radius: 0.75rem;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-sm);
  animation: msg-in 0.3s ease-out;
}

.dark .ai-chat .answer-card {
  background: var(--color-bg-3);
  box-shadow: none;
}

@keyframes msg-in {
  from {
    opacity: 0;
    transform: translateY(0.5rem);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* 区块内容浮现 + 蓝色生成光晕(卡片生成瞬间) */
.reveal {
  animation: msg-in 0.35s ease-out, gen-glow 1.6s ease-out 0.1s;
}

@keyframes gen-glow {
  0% {
    box-shadow: 0 0 0.75rem 0.25rem rgba(0, 103, 209, 0.5);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(0, 103, 209, 0);
  }
}

/* 发送后短暂等待行 */
.ac-wait {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* ---------- 可折叠区头(思考 / 技能选择匹配) ---------- */
.ac-section-head {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  width: 100%;
  padding: 0.25rem 0;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--on-surface);
}

.ac-lead-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}

/* 思考中:图标蓝色光晕呼吸 */
.ac-lead-icon.is-live {
  animation: think-pulse 1.1s ease-in-out infinite;
}

@keyframes think-pulse {
  0%,
  100% {
    text-shadow: none;
    transform: scale(1);
  }
  50% {
    text-shadow: 0 0 0.5rem rgba(0, 103, 209, 0.9);
    transform: scale(1.1);
  }
}

.ac-section-title {
  flex: 1 1 0;
  min-width: 0;
  text-align: left;
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ac-head-state {
  flex: 0 0 auto;
  display: inline-flex;
  color: var(--primary);
}

.ac-head-state .ac-done {
  color: var(--success);
}

.ac-head-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  color: var(--on-surface-variant);
}

/* 旋转加载图标 */
.is-spin {
  animation: ac-spin 1s linear infinite;
}

@keyframes ac-spin {
  to {
    transform: rotate(360deg);
  }
}

/* 思考过程内容(浅色内嵌区) */
.ac-think-body {
  margin: 0.25rem 0 0.25rem 1.25rem;
  padding: 0.5rem 0.625rem;
  border-radius: 0.5rem;
  background: var(--surface-variant);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.dark .ai-chat .ac-think-body {
  background: var(--color-bg-4);
}

/* ---------- 任务拆解与规划(区块标签 + 技能小步骤) ---------- */
.ac-block-label {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0 0.125rem;
}

.ac-block-label .ac-lead-icon.is-ok {
  color: var(--success);
}

.ac-block-name {
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.ac-plan-body {
  margin-left: 1.25rem;
  display: flex;
  flex-direction: column;
}

/* 步骤条图标内容居中(数字/对勾处于圆心,各状态一致) */
.ai-chat .ac-steps .ant-steps-item-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.ai-chat .ac-steps .ant-steps-item-icon .ant-steps-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* 步骤条标题/描述:强制面板亮色令牌
   antd 运行时注入的浅色主题样式晚于静态样式插入,须以更高优先级覆盖,
   否则描述文字为浅色主题深灰,在深色面板上不可读 */
.ai-chat .ac-steps .ant-steps-item .ant-steps-item-title {
  color: var(--on-surface) !important;
}

.ai-chat .ac-steps .ant-steps-item.ant-steps-item-wait .ant-steps-item-title {
  color: var(--on-surface-variant) !important;
}

.ai-chat .ac-steps .ant-steps-item .ant-steps-item-description {
  color: var(--on-surface) !important;
  font: var(--font-body-s);
  line-height: var(--line-height-md);
}

/* 步骤一描述:标签文件胶囊 */
.ac-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  margin-top: 0.25rem;
  padding-bottom: 0.125rem;
}

.ac-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.125rem 0.5rem;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--on-primary-container);
  font: var(--font-caption-m);
}

/* ---------- 总任务规划清单小卡片 ---------- */
.plan-card {
  margin-top: 0.75rem;
  padding: 0.75rem 0.875rem;
  border-radius: 0.75rem;
  background: var(--surface-variant);
  animation: msg-in 0.35s ease-out, gen-glow 1.8s ease-out 0.1s;
}

.dark .ai-chat .plan-card {
  background: var(--color-bg-4);
}

.plan-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.plan-card-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.plan-fold {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.5rem;
  height: 1.5rem;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.plan-fold:hover {
  background: var(--surface-container-highest);
  color: var(--on-surface);
}

.dark .ai-chat .plan-fold:hover {
  background: rgba(255, 255, 255, 0.08);
}

.plan-card-hint {
  margin-top: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-caption-m);
  color: var(--success);
}

.plan-list {
  margin: 0.625rem 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}

.plan-list li {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-body-s);
  color: var(--on-surface);
  animation: msg-in 0.3s ease-out both;
}

/* 未轮到逐条打印的清单项:占位隐藏,保持列表高度稳定 */
.plan-list li.is-hidden {
  visibility: hidden;
}

.plan-idx {
  flex: 0 0 auto;
  width: 1.125rem;
  height: 1.125rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  background: var(--primary);
  color: var(--on-primary);
  font: var(--font-caption-s);
}

/* ---------- 确认提示(确认后才继续) ---------- */
.ac-confirm {
  padding: 0.75rem 0.875rem;
  border-radius: 0.75rem;
  background: var(--primary-container);
  animation: msg-in 0.35s ease-out;
}

.ac-confirm.is-shake {
  animation: ac-shake 0.45s ease;
}

@keyframes ac-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-3px);
  }
  50% {
    transform: translateX(3px);
  }
  75% {
    transform: translateX(-2px);
  }
}

.ac-confirm-text {
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-primary-container);
}

.ac-confirm-btns {
  margin-top: 0.625rem;
  display: flex;
  gap: 0.5rem;
}

/* ---------- 最终结果与逐字打印光效 ---------- */
.ac-result {
  font: var(--font-body-m);
  color: var(--on-surface);
}

.ac-tw-line {
  margin: 0;
  line-height: var(--line-height-md);
}

.ac-tw-line.is-item {
  padding-left: 0.5rem;
}

/* ---------- 打印渐变蒙层(小矩形光带) ----------
   文字本身保持原色;上方覆盖一层与原文完全重叠的渐变文本,
   双向遮罩取交集:横向只露末端约 11em,纵向只露最后一行高度,
   确保光带仅出现在"正在打印的最末视觉行"的行尾,
   前面各行的行尾不再出现渐变 */
.tw-live {
  position: relative;
}

.ac-tw-line.is-live {
  position: relative;
}

.tw-veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: transparent;
  background-image: linear-gradient(
    90deg,
    #06b6d4 0%,
    #2563eb 35%,
    #7c3aed 70%,
    #ec4899 100%
  );
  background-size: 11em 100%;
  background-repeat: no-repeat;
  background-position: right center;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-mask-image: linear-gradient(
      to right,
      transparent calc(100% - 11em),
      rgba(0, 0, 0, 0.9) 100%
    ),
    linear-gradient(
      to bottom,
      transparent calc(100% - 1.5em),
      rgba(0, 0, 0, 0.95) calc(100% - 1.2em),
      rgba(0, 0, 0, 0.95) 100%
    );
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(
      to right,
      transparent calc(100% - 11em),
      rgba(0, 0, 0, 0.9) 100%
    ),
    linear-gradient(
      to bottom,
      transparent calc(100% - 1.5em),
      rgba(0, 0, 0, 0.95) calc(100% - 1.2em),
      rgba(0, 0, 0, 0.95) 100%
    );
  mask-composite: intersect;
  filter: drop-shadow(0 0 0.375rem rgba(236, 72, 153, 0.5));
}

/* 打印光标:青→紫→粉三段渐变竖条,辉光与边缘粉色呼应 */
.tw-caret {
  display: inline-block;
  width: 0.125rem;
  height: 0.9em;
  margin-left: 0.125rem;
  vertical-align: -0.1em;
  border-radius: var(--radius-full);
  background: linear-gradient(
    180deg,
    #06b6d4 0%,
    #7c3aed 55%,
    #ec4899 100%
  );
  box-shadow: 0 0 0.375rem rgba(236, 72, 153, 0.7),
    0 0 0.75rem rgba(124, 58, 237, 0.5);
  animation: caret-blink 0.9s ease-in-out infinite;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}

/* ---------- 底部操作条:左耗时 | 右五图标 ---------- */
.ac-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 0.5rem;
  border-top: var(--border-width-thin) solid var(--divider);
  animation: msg-in 0.35s ease-out;
}

.ac-cost {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.ac-actions {
  display: flex;
  align-items: center;
  gap: 0.125rem;
}

.ac-action {
  width: 1.75rem;
  height: 1.75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.ac-action:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.ac-action.is-on {
  color: var(--primary);
}

.dark .ai-chat .ac-action:hover {
  background: rgba(255, 255, 255, 0.08);
}


/* 内容生成画布:标题 + 彩色虚线流转矩形(持续动效) */

.content-gen {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ---------- 顶部标题 ---------- */
.gen-head {
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
}

.gen-title {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.gen-title svg {
  color: var(--primary);
  align-self: center;
}

.gen-sub {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* ---------- 虚线流转矩形:高度为可用区一半,垂直居中 ---------- */
.gen-stage {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: center; /* 垂直居中 */
}

.gen-frame {
  position: relative;
  width: 100%;
  height: 50%; /* 高度为一半 */
  border-radius: 1.5rem;
}

.gen-border {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 0.375rem rgba(37, 99, 235, 0.35));
}

/* 两层虚线矩形沿 stroke 流转(彩色渐变描边)
   rect 自身 x/y 内缩 3px,尺寸需同步减去 6px,否则右/下边被 SVG 视口裁掉 */
.gen-rect {
  width: calc(100% - 6px);
  height: calc(100% - 6px);
  fill: none;
  stroke: url(#genGrad);
  stroke-width: 2;
  stroke-dasharray: 10 8;
}

.gen-rect-fast {
  animation: gen-dash 6s linear infinite;
}

.gen-rect-slow {
  opacity: 0.45;
  stroke-dasharray: 4 10;
  animation: gen-dash-rev 11s linear infinite;
}

@keyframes gen-dash {
  to {
    stroke-dashoffset: -360;
  }
}

@keyframes gen-dash-rev {
  to {
    stroke-dashoffset: 360;
  }
}

/* ---------- 矩形中心内容 ---------- */
.gen-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}

/* 发光圆球:蓝色呼吸光晕 */
.gen-orb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 3.25rem;
  height: 3.25rem;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary);
  animation: orb-glow 2s ease-in-out infinite;
}

@keyframes orb-glow {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(0, 103, 209, 0.3);
  }
  50% {
    box-shadow: 0 0 1.25rem 0.375rem rgba(0, 103, 209, 0.25);
  }
}

.gen-text {
  display: inline-flex;
  align-items: baseline;
  gap: 0.125rem;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

/* 三点跳动 */
.gen-dots {
  display: inline-flex;
  align-items: baseline;
  gap: 0.1875rem;
}

.gen-dots i {
  width: 0.25rem;
  height: 0.25rem;
  border-radius: var(--radius-full);
  background: var(--primary);
  animation: gen-dot 1.2s ease-in-out infinite;
}

.gen-dots i:nth-child(2) {
  animation-delay: 0.2s;
}

.gen-dots i:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes gen-dot {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: 0.45;
  }
  30% {
    transform: translateY(-0.25rem);
    opacity: 1;
  }
}

.gen-hint {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* ---------- 深色主题:增强虚线发光与光晕,保证暗背景下的动效可见性 ---------- */
.dark .content-gen .gen-border {
  filter: drop-shadow(0 0 0.5rem rgba(37, 99, 235, 0.55));
}

.dark .content-gen .gen-rect-slow {
  opacity: 0.6;
}

.dark .content-gen .gen-orb {
  animation: orb-glow-dark 2s ease-in-out infinite;
}

@keyframes orb-glow-dark {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(0, 103, 209, 0.4);
  }
  50% {
    box-shadow: 0 0 1.5rem 0.5rem rgba(0, 103, 209, 0.35);
  }
}


/* ===== ChangeFlow 配置变更流程校验组件 =====
   根容器:深色运维控制台风格,填充 AI 页右侧画布(顶栏固定 + 流程区滚动) */

.cf {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  background: #141418;
  color: #e0e0e0;
  --cf-detail-icon-color: #dfdfdf;
  --cf-card-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  border-radius: var(--radius-xl);
  overflow: hidden;
  font-family: var(--font-family);
}

/* 背景网格 */
.cf::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(
    circle at 1px 1px,
    rgba(255, 255, 255, 0.018) 1px,
    transparent 0
  );
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* 内容层 */
.cf-topbar,
.cf-flow {
  position: relative;
  z-index: 1;
}

/* ===== 动画定义 ===== */
@keyframes cfFadeInUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes cfTagIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes cfSpin {
  to {
    transform: rotate(360deg);
  }
}
/* 流光旋转角度(需 @property 注册才能平滑插值) */
@property --cf-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
@keyframes cfFlow {
  to {
    --cf-angle: 360deg;
  }
}
/* 箭头白色彗星流光:自上而下循环流动 */
@keyframes cfComet {
  0% {
    transform: translateX(-50%) translateY(-14px);
    opacity: 0;
  }
  25% {
    opacity: 1;
  }
  75% {
    opacity: 1;
  }
  100% {
    transform: translateX(-50%) translateY(30px);
    opacity: 0;
  }
}

.cf-anim {
  opacity: 0;
  animation: cfFadeInUp 0.7s ease-in-out forwards;
}
.cf-tag-load {
  opacity: 0;
  animation: cfTagIn 0.5s ease-in-out forwards;
}

/* ===== 顶部导航栏 ===== */
.cf-topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 28px;
  background: linear-gradient(180deg, #1c1c22 0%, #18181d 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.cf-topbar-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.cf-topbar-icon {
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, #7c5cfc, #a78bfa);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cf-topbar-title {
  font-size: 15px;
  font-weight: var(--font-weight-semibold);
  color: #f0f0f0;
}
.cf-topbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.cf-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  background: none;
  border: none;
  color: #b0b0b0;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: color 0.2s ease;
}
.cf-btn:hover {
  color: #fff;
}

/* 视图缩放控件 */
.cf-zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  z-index: 10;
}
.cf-zoom-btn {
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 4px;
  color: #b0b0b0;
  font-family: inherit;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.cf-zoom-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.cf-zoom-btn:disabled {
  color: #555;
  cursor: not-allowed;
}

/* ===== 流程图(可滚动) ===== */
.cf-flow {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 64px;
  transform-origin: top center;
}
.cf-flow::-webkit-scrollbar {
  width: 0.375rem;
}
.cf-flow::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-full);
}
.cf-terminal {
  width: 60px;
  height: 39px;
  border-radius: 19.5px;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--font-weight-medium);
  color: #ccc;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}
.cf-arrow {
  width: 1.5px;
  height: 30px;
  flex-shrink: 0;
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.22),
    rgba(255, 255, 255, 0.1)
  );
  position: relative;
  overflow: hidden;
}
.cf-arrow::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 6px solid rgba(255, 255, 255, 0.22);
}
/* 白色彗星流光:仅在箭头内自上而下循环流动,加载完成后消失 */
.cf-arrow--loading::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  width: 3px;
  height: 14px;
  transform: translateX(-50%);
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(255, 255, 255, 0.9)
  );
  border-radius: 2px;
  animation: cfComet 1.4s linear infinite;
  pointer-events: none;
}

/* ===== 条件分支 ===== */
.cf-branch {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
.cf-branch-cols {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}
/* 分叉/汇合贝塞尔曲线(SVG) */
.cf-branch-fork,
.cf-branch-join {
  position: relative;
  width: 840px;
  max-width: 100%;
  height: 50px;
}
.cf-branch-fork svg,
.cf-branch-join svg {
  width: 100%;
  height: 100%;
  display: block;
}
.cf-branch-fork path,
.cf-branch-join path {
  fill: none;
  stroke: rgba(255, 255, 255, 0.22);
  stroke-width: 1.5;
  vector-effect: non-scaling-stroke;
}
.cf-branch-label {
  position: absolute;
  top: 35px;
  transform: translate(-50%, -50%);
  font-size: 12px;
  font-weight: var(--font-weight-medium);
  color: #aeaeae;
  background: #2a2a2a;
  border: 1px solid rgba(174, 174, 174, 0.4);
  border-radius: var(--radius-full);
  padding: 2px 10px;
  line-height: 1.4;
  white-space: nowrap;
}
.cf-branch-label--left {
  left: 310px;
}
.cf-branch-label--right {
  left: 530px;
}

/* ===== 步骤卡片 ===== */
.cf-card-outer {
  position: relative;
  width: 400px;
  max-width: 100%;
  flex-shrink: 0;
}
.cf-card {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  width: 100%;
  --cf-border-color: rgba(243, 243, 243, 0.03);
  background: #2a2a2a;
  border: 1px solid var(--cf-border-color);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: var(--cf-card-shadow);
  transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
  overflow: hidden;
  cursor: pointer;
}
.cf-card::after {
  content: "";
  pointer-events: none;
}
/* 悬浮:边框加粗(内圈阴影叠加,避免布局位移) */
.cf-card:hover {
  box-shadow: inset 0 0 0 1px var(--cf-border-color), var(--cf-card-shadow);
}
/* 选中:蓝色边框 */
.cf-card--selected {
  --cf-border-color: #3b82f6;
}

/* 加载中:外发光 + 流光边框 + 弥散光晕 */
.cf-card-outer--loading::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: conic-gradient(
    from var(--cf-angle) at 50% 50%,
    #5ca2e9 0%,
    #3f21b5 25%,
    #7a6b44 50%,
    #ff9566 75%,
    #5ca2e9 100%
  );
  animation: cfFlow 4s linear infinite;
  filter: blur(2px);
  opacity: 0.4;
  transition: opacity 0.45s ease-out;
  z-index: 0;
  pointer-events: none;
}
.cf-card--loading {
  --cf-angle: 0deg;
  border: none;
  border-color: transparent;
}
/* 流光边框:旋转圆锥渐变 + 叠加白色流光,仅露出外圈 1.5px */
.cf-card--loading::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: conic-gradient(
      from var(--cf-angle) at 50% 50%,
      transparent 0deg,
      transparent 15deg,
      rgba(255, 255, 255, 0.95) 35deg,
      transparent 60deg,
      transparent 360deg
    ),
    conic-gradient(
      from var(--cf-angle) at 50% 50%,
      #5ca2e9 0%,
      #3f21b5 25%,
      #7a6b44 50%,
      #ff9566 75%,
      #5ca2e9 100%
    );
  animation: cfFlow 4s linear infinite;
  transition: opacity 0.45s ease-out;
  z-index: 0;
  pointer-events: none;
}
/* 遮罩:内缩 1.5px,露出流光边框,内部填充不透明底色 */
.cf-card--loading::after {
  content: "";
  position: absolute;
  inset: 1.5px;
  width: auto;
  border-radius: 6.5px;
  background: #2a2a2a;
  z-index: 1;
  pointer-events: none;
}
/* 弥散光晕:卡片内部叠加径向渐变 */
.cf-card-glow {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: radial-gradient(
      circle at 100% 0%,
      rgba(0, 103, 209, 0.15) 0%,
      transparent 60%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(246, 158, 57, 0.05) 0%,
      transparent 60%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(142, 129, 244, 0.1) 0%,
      transparent 60%
    );
  transition: opacity 0.45s ease-out;
  z-index: 2;
  pointer-events: none;
}
/* 卡片右侧规律点阵装饰(40%占比,透明度渐进式递增) */
.cf-card-dots {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 40%;
  background-image: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.12) 1px,
    transparent 1.5px
  );
  background-size: 8px 8px;
  background-position: 0 0;
  -webkit-mask-image: linear-gradient(
    to right,
    transparent 0%,
    rgba(0, 0, 0, 0.03) 20%,

(function () {
  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 主题模式与业务状态
// 换肤单轨驱动:isDark 切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随。
const AppContext = createContext(null);

function AppProvider({ children }) {
  // 页面默认深色主题
  const [isDark, setIsDark] = useState(true);
  // 侧边菜单默认收起(3rem 宽),点击底部按钮/头部汉堡图标可展开为 16rem
  const [menuCollapsed, setMenuCollapsed] = useState(true);
  // 当前激活的菜单项 key
  const [activeMenu, setActiveMenu] = useState("overview");
  // AI 会话是否已开始(发送首条消息后置 true,右侧主内容区展示画布)
  const [aiChatActive, setAiChatActive] = useState(false);
  // 配置变更流程启动标记:AI 问答点击「确认」后 +1,右侧画布切换为流程组件;
  // 每次发送新提问重置为 0(回到"内容生成中")
  const [aiFlowRunId, setAiFlowRunId] = useState(0);
  // 从首页输入框/模板库携带到 AI 会话的待发送内容(跳转后自动开始问答)
  // 形如 { text, title } —— title 为模板名(可选),用作会话标题
  const [pendingQuestion, setPendingQuestion] = useState(null);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    menuCollapsed,
    toggleMenu: () => setMenuCollapsed((c) => !c),
    activeMenu,
    setActiveMenu,
    aiChatActive,
    startAiChat: () => {
      setAiChatActive(true);
      setAiFlowRunId(0);
    },
    aiFlowRunId,
    launchAiFlow: () => setAiFlowRunId((id) => id + 1),
    pendingQuestion,
    setPendingQuestion,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

  const fs = getComputedStyle(document.documentElement).fontSize;
  return parseFloat(fs) || 16;
}

// 将 getComputedStyle 返回的 rgb()/rgba() 字符串转为 #RRGGBB，用于 icon-plus API 颜色匹配
function rgbToHex(rgb) {
  if (!rgb) return null;
  const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (!m) return null;
  return "#" + [1, 2, 3].map(function (i) { return parseInt(m[i], 10).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null
function hexToRgb(hex) {
  if (!hex) return null;
  let h = String(hex).replace(/^#/, "").trim();
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// 两个 hex 颜色的欧氏距离（RGB 空间），用于 icon-plus 颜色就近匹配
function colorDistance(a, b) {
  const ra = hexToRgb(a);
  const rb = hexToRgb(b);
  if (!ra || !rb) return Infinity;
  return Math.sqrt(
    (ra[0] - rb[0]) ** 2 + (ra[1] - rb[1]) ** 2 + (ra[2] - rb[2]) ** 2
  );
}

// getIcon 接口的 size 参数需数字 px。源 size 可能是 rem/px/数字，转 px 后吸附到 icon-plus 标准尺寸。
const API_SIZES = [12, 14, 16, 20, 24, 32, 36, 40, 48, 60];
function toApiSize(size) {
  let n = null;
  if (size != null) {
    const m = String(size).trim().match(/(-?\d+(?:\.\d+)?)\s*(rem|px)?/i);
    if (m) {
      n = Number(m[1]);
      if (m[2] && m[2].toLowerCase() === "rem") n = n * getRootFontSize();
    }
  }
  if (n == null || Number.isNaN(n)) return 16;
  let best = API_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of API_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { bestDiff = d; best = s; }
  }
  return best;
}

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
// 精确命中 → 就近匹配（RGB 欧氏距离最小）→ defaultColorId 兜底
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const target = colorHex.toUpperCase();
    // 1. 精确匹配：某个 color 的 value 列表里直接包含目标色
    const exact = colors.find((c) =>
      String(c.value).split(",").map((v) => v.trim().toUpperCase()).includes(target)
    );
    if (exact) return exact.id;
    // 2. 就近匹配：取与目标色 RGB 距离最小的 color（多色值取其中最近的）
    let best = null;
    let bestDist = Infinity;
    for (const c of colors) {
      for (const v of String(c.value).split(",")) {
        const d = colorDistance(target, v.trim());
        if (d < bestDist) { bestDist = d; best = c; }
      }
    }
    if (best) return best.id;
  }
  // 3. 兜底：线性通用色 → 该 style 下第一个 → 空串
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();
