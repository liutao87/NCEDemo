(function () {
  const { useEffect, useRef, useState } = React;
  const { Input, Popover, Select } = antd;
  const { Icon, SCENE_OPTIONS, TEMPLATES } = __export;
const { TextArea } = Input;

const TPL_TABS = [
  { key: "all", label: "全部" },
  { key: "device", label: "设备" },
  { key: "app", label: "应用" },
  { key: "security", label: "安全" },
];

const MAX_LEN = 2000;
const PLACEHOLDER = "输入问题或输入“/”触发提示词";

// 模板库浮层面板:标题 + 分类tab + 模板列表(354px,超出滚动)
function TplPanel({ tab, onTab, selectedKey, onPick }) {
  const list = TEMPLATES.filter((t) => tab === "all" || t.category === tab);
  return (
    <div className="tpl-panel">
      <div className="tpl-title">模板列表</div>
      <div className="tpl-tabs">
        {TPL_TABS.map((t) => (
          <button
            key={t.key}
            type="button"
            className={t.key === tab ? "tpl-tab is-active" : "tpl-tab"}
            onClick={() => onTab(t.key)}
          >
            {t.label}
          </button>
        ))}
      </div>
      <div className="tpl-list">
        {list.map((t) => (
          <button
            key={t.key}
            type="button"
            className={t.key === selectedKey ? "tpl-item is-active" : "tpl-item"}
            onClick={() => onPick(t)}
          >
            <Icon name={t.icon} size="0.875rem" />
            <span className="tpl-name">{t.name}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// AI 输入框:初始 48px 单行,点击展开为 120px 完整输入区(渐变彩边 + 模板库 + 字数 + 发送)
// 展开后保持大输入框状态,不因点击外部而收起;defaultExpanded 可指定初始即展开
// onSend:发送回调(Enter/点击发送触发),发送后清空输入;busy:回答生成中锁定发送
function Composer({ defaultExpanded = false, busy = false, onSend }) {
  const [expanded, setExpanded] = useState(defaultExpanded);
  const [text, setText] = useState("");
  const [scene, setScene] = useState("config");
  const [tplOpen, setTplOpen] = useState(false);
  const [tplTab, setTplTab] = useState("all");
  const [selectedTpl, setSelectedTpl] = useState(null);
  const taRef = useRef(null);

  useEffect(() => {
    if (expanded && taRef.current) taRef.current.focus();
  }, [expanded]);

  const canSend = Boolean(onSend) && !busy && text.trim().length > 0;
  const tplLabel = selectedTpl ? selectedTpl.name : "模板库";

  // 发送:回调后清空输入内容与已选模板;携带模板名(若来自模板库)供会话标题使用
  const doSend = () => {
    if (!canSend) return;
    onSend(
      text.trim(),
      selectedTpl ? { tplName: selectedTpl.name } : null
    );
    setText("");
    setSelectedTpl(null);
  };

  const pickTpl = (tpl) => {
    // 点击模板列表项:直接发送(携带模板名作为会话标题),不再先填入输入框
    if (!onSend || busy) return;
    setTplOpen(false);
    setText("");
    setSelectedTpl(null);
    onSend(tpl.prompt, { tplName: tpl.name });
  };

  const clearTpl = () => {
    setSelectedTpl(null);
    setText("");
  };

  if (!expanded) {
    // 初始态:48px 小输入框,点击展开
    return (
      <div className="session-composer">
        <button
          type="button"
          className="composer-frame is-small"
          onClick={() => setExpanded(true)}
          aria-label="展开输入框"
        >
          <span className="composer-inner">
            <span className="composer-placeholder">{text || PLACEHOLDER}</span>
            <span className="composer-send-mini">
              <Icon name="send" size="1rem" />
            </span>
          </span>
        </button>
      </div>
    );
  }

  // 展开态:120px 大输入框 + 工具栏 + AI 提示(保持展开,不自动收起)
  return (
    <div className="session-composer">
      <div className="composer-frame is-big">
        <div className="composer-inner">
          <div className="composer-input">
            <TextArea
              ref={taRef}
              variant="borderless"
              value={text}
              placeholder={PLACEHOLDER}
              maxLength={MAX_LEN}
              onChange={(e) => setText(e.target.value)}
              onPressEnter={(e) => {
                if (!e.shiftKey) {
                  e.preventDefault();
                  doSend();
                }
              }}
              style={{ height: "100%", resize: "none" }}
            />
          </div>
          <div className="composer-toolbar">
            <div className="composer-tools-left">
              <Select
                className="scene-select"
                variant="borderless"
                value={scene}
                onChange={setScene}
                popupMatchSelectWidth={false}
                options={SCENE_OPTIONS.map((o) => ({
                  value: o.value,
                  label: (
                    <span className="scene-label">
                      <Icon name="sliders-horizontal" size="0.75rem" />
                      {o.label}
                    </span>
                  ),
                }))}
              />
              <Popover
                arrow={false}
                trigger="click"
                placement="topLeft"
                open={tplOpen}
                onOpenChange={setTplOpen}
                overlayClassName="tpl-popover"
                content={
                  <TplPanel
                    tab={tplTab}
                    onTab={setTplTab}
                    selectedKey={selectedTpl ? selectedTpl.key : ""}
                    onPick={pickTpl}
                  />
                }
              >
                <div
                  className={selectedTpl ? "tool-btn is-active" : "tool-btn"}
                  role="button"
                  tabIndex={0}
                  aria-label="打开模板库"
                >
                  <Icon name="layout-template" size="0.75rem" />
                  <span className="tool-btn-text">{tplLabel}</span>
                  {selectedTpl ? (
                    <span
                      className="tool-btn-clear"
                      role="button"
                      tabIndex={0}
                      title="清除模板"
                      onMouseDown={(e) => e.stopPropagation()}
                      onClick={(e) => {
                        e.stopPropagation();
                        clearTpl();
                      }}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" || e.key === " ") {
                          e.stopPropagation();
                          clearTpl();
                        }
                      }}
                    >
                      <Icon name="x" size="0.75rem" />
                    </span>
                  ) : null}
                </div>
              </Popover>
              <span className="word-count">
                {text.length}/{MAX_LEN}
              </span>
            </div>
            <div className="composer-tools-right">
              <button type="button" className="icon-tool" title="插入链接">
                <Icon name="link" size="1rem" />
              </button>
              <button type="button" className="icon-tool" title="语音输入">
                <Icon name="mic" size="1rem" />
              </button>
              <button
                type="button"
                className={canSend ? "send-btn is-active" : "send-btn"}
                title={busy ? "回答生成中…" : "发送"}
                onClick={doSend}
              >
                <Icon name={busy ? "loader-circle" : "send"} size="1rem" className={busy ? "is-spin" : ""} />
              </button>
            </div>
          </div>
        </div>
      </div>
      <div className="composer-hint">
        <span>内容由ai生成，无法确保准确性和完整性，仅供参考。</span>
        <Icon name="circle-question-mark" size="0.75rem" />
      </div>
    </div>
  );
}
  Object.assign(__export, { Composer });
})();

(function () {
  const { useEffect, useRef, useState } = React;
  const { Icon, useApp, CHINA_PROVINCES, NINE_DASH_LINES, MAP_MARKERS, MAP_HUBS, LINK_LABELS } = __export;
// Layer 3: 中国地图 — canvas 绘制(阿里 DataV 高德行政区划数据)
// 双层边界:省界线(细,浅色) + 国界/海岸线(粗,深色,CHINA_BORDER)
// 其余:省份文本 + 绿色标注点 + 连线 + 枢纽 logo(DOM 叠加) + 南海附图,明暗配色自动跟随

const LON_MIN = 73.2;
const LON_MAX = 135.8;
const LAT_MIN = 17.2;
const LAT_MAX = 53.9;
// 中纬度(~35°N)经度方向收缩系数,让形状更接近真实观感
const MID_LAT_K = Math.cos((35 * Math.PI) / 180);
const SPAN_X = (LON_MAX - LON_MIN) * MID_LAT_K;
const SPAN_Y = LAT_MAX - LAT_MIN;

// 省份文本字号分级(px 基准,随画布宽度整体缩放)
const FONT_BASE = { lg: 12.5, md: 11.5, sm: 10.5, xs: 9 };

function readToken(el, name, fallback) {
  if (!el) return fallback;
  const v = window.getComputedStyle(el).getPropertyValue(name).trim();
  return v || fallback;
}

function withAlpha(color, alpha) {
  if (typeof color === "string" && color.startsWith("#")) {
    let h = color.slice(1);
    if (h.length === 3) {
      h = h
        .split("")
        .map((c) => c + c)
        .join("");
    }
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    if (Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b)) return color;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  return color;
}

// 南海诸岛附图(右下角示意框:真实九段线 + 台湾/海南轮廓投影)
function drawSouthSea(ctx, x0, y0, w, h, colors, hainan, taiwan) {
  ctx.save();
  ctx.strokeStyle = colors.border;
  ctx.lineWidth = 1;
  ctx.strokeRect(x0, y0, w, h);
  ctx.fillStyle = colors.fill;
  ctx.fillRect(x0, y0, w, h);
  // 附图投影:南海区域 lon[104,123.5] lat[1,23.5] 线性映射进框内
  const SL0 = 104;
  const SL1 = 123.5;
  const SA0 = 1;
  const SA1 = 23.5;
  const prj = (lon, lat) => [x0 + ((lon - SL0) / (SL1 - SL0)) * w, y0 + ((SA1 - lat) / (SA1 - SA0)) * h];
  const strokeRing = (ring) => {
    ctx.beginPath();
    ring.forEach(([lon, lat], i) => {
      const [x, y] = prj(lon, lat);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.closePath();
  };
  // 九段线(每段为细条轮廓,取形画成虚线段)
  ctx.strokeStyle = colors.sea;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([3, 2]);
  NINE_DASH_LINES.forEach((seg) => {
    strokeRing(seg);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  // 台湾 / 海南轮廓
  ctx.fillStyle = colors.sea;
  if (taiwan) {
    strokeRing(taiwan);
    ctx.fill();
  }
  if (hainan) {
    strokeRing(hainan);
    ctx.fill();
  }
  ctx.fillStyle = colors.label;
  ctx.font = `400 9px "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("南海诸岛", x0 + w / 2, y0 + h * 0.1);
  ctx.restore();
}

function ChinaMap() {
  const { isDark } = useApp();
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  // 视图状态:交互缩放/平移(ref 存放,重绘时读取,不触发 React 渲染)
  const viewRef = useRef({ zoom: 1, panX: 0, panY: 0 });
  const redrawRef = useRef(null); // 重绘函数引用(控制按钮触发)
  const [hubPos, setHubPos] = useState([]);

  useEffect(() => {
    const wrap = wrapRef.current;
    const canvas = canvasRef.current;
    if (!wrap || !canvas) return undefined;

    const draw = () => {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w <= 0 || h <= 0) return;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // 颜色取自组件 CSS 中的地图专属变量(浅/暗两套,.dark 切换后随之变化)
      const cFill = readToken(wrap, "--map-fill", "#F0F0F0");
      const cLine = readToken(wrap, "--map-line", "#D9D9D9"); // 省界线
      const cText = readToken(wrap, "--map-text", "#595959");
      const cSub = readToken(wrap, "--map-text-sub", "#8C8C8C");
      const cMarker = readToken(wrap, "--map-link", "#08A471"); // 标注点
      const cLink = readToken(wrap, "--map-link", "#08A471"); // 连线/logo
      const cStripe = readToken(wrap, "--map-stripe", "#202020"); // 背景条纹

      // 0. 背景竖直条纹(条纹与间隔交替布满画布,省份多边形覆盖其上)
      const stripeW = 3; // 条纹宽 3px
      const stripeGap = 2; // 间隙 2px
      ctx.fillStyle = cStripe;
      for (let x = 0; x < w; x += stripeW + stripeGap) {
        ctx.fillRect(x, 0, stripeW, h);
      }

      // 基础投影(等比缩放 + 居中,整体放大 1.3 倍)
      const ZOOM = 1.3;
      const pad = 10;
      const scale =
        ZOOM * Math.min((w - pad * 2) / SPAN_X, (h - pad * 2) / SPAN_Y);
      const offsetX = (w - SPAN_X * scale) / 2;
      const offsetY = (h - SPAN_Y * scale) / 2;
      // 视图变换:绕画布中心缩放 + 平移(滚轮缩放/拖拽交互)
      const { zoom, panX, panY } = viewRef.current;
      const cx = w / 2;
      const cy = h / 2;
      const project = (lon, lat) => {
        const bx = offsetX + (lon - LON_MIN) * MID_LAT_K * scale;
        const by = offsetY + (LAT_MAX - lat) * scale;
        return [(bx - cx) * zoom + cx + panX, (by - cy) * zoom + cy + panY];
      };
      const strokePath = (points) => {
        ctx.beginPath();
        points.forEach(([lon, lat], i) => {
          const [x, y] = project(lon, lat);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
      };

      // 1. 省份:填充 + 省界线(细,浅色)
      ctx.lineJoin = "round";
      CHINA_PROVINCES.forEach((p) => {
        strokePath(p.points);
        ctx.fillStyle = cFill;
        ctx.fill();
        ctx.strokeStyle = cLine;
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // 2. 省份文本(字号随画布宽度 + 视图缩放整体缩放,设上下限)
      const fontScale =
        Math.min(Math.max(w / 760, 0.78), 1.15) *
        Math.min(Math.max(zoom, 0.6), 2);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      CHINA_PROVINCES.forEach((p) => {
        const fs = FONT_BASE[p.size] * fontScale;
        ctx.font = `400 ${fs}px "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = p.size === "lg" || p.size === "md" ? cText : cSub;
        const [lx, ly] = project(p.label[0], p.label[1]);
        ctx.fillText(p.name, lx, ly);
      });

      // 4. 站点连线:每个站点标注点与前海/嘉定/外高桥三个枢纽全部互联
      const remPx = parseFloat(window.getComputedStyle(document.documentElement).fontSize) || 16;
      ctx.lineWidth = 1;
      ctx.strokeStyle = cLink;

        const [x1, y1] = project(m.lon, m.lat);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

      // 4.5 枢纽骨干互联(前海 ↔ 嘉定 ↔ 外高桥 三角骨干环,线加粗与站点接入线区分)
      ctx.lineWidth = 1.5;
      const hubPairs = [
        ["qianhai", "jiading"],
        ["jiading", "waigaoqiao"],
        ["waigaoqiao", "qianhai"],
      ];
      hubPairs.forEach(([idA, idB]) => {
        const h1 = MAP_HUBS.find((hb) => hb.id === idA);
        const h2 = MAP_HUBS.find((hb) => hb.id === idB);
        if (!h1 || !h2) return;
        const [x1, y1] = project(h1.lon, h1.lat);
        const [x2, y2] = project(h2.lon, h2.lat);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

      ctx.lineWidth = 1;

      // 4.7 连线序列号标签:部分线条中点,圆(直径2rem)或长方形(2rem×1rem)包裹数字
      //     背景色同连线色,数字白色
      const resolveRef = (ref) => {
        if (ref.startsWith("hub:")) {
          const hub = MAP_HUBS.find((h) => h.id === ref.slice(4));
          return hub ? [hub.lon, hub.lat] : null;
        }
        const m = MAP_MARKERS.find((mk) => mk.city === ref);
        return m ? [m.lon, m.lat] : null;
      };
      LINK_LABELS.forEach((lb) => {
        const p1 = resolveRef(lb.from);
        const p2 = resolveRef(lb.to);
        if (!p1 || !p2) return;
        const [x1, y1] = project(p1[0], p1[1]);
        const [x2, y2] = project(p2[0], p2[1]);
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const w = 2 * remPx;
        ctx.font = `500 ${0.875 * remPx}px "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (lb.shape === "circle") {
          // 圆:无方向,数字水平居中
          ctx.beginPath();
          ctx.arc(mx, my, w / 2, 0, Math.PI * 2);
          ctx.fillStyle = cLink;
          ctx.fill();
          ctx.fillStyle = "#FFFFFF";
          ctx.fillText(String(lb.num), mx, my);
        } else {
          // 长方形:长边沿线条方向旋转,数字沿长边方向排列(角度归一避免倒立)
          let angle = Math.atan2(y2 - y1, x2 - x1);
          if (angle > Math.PI / 2) angle -= Math.PI;
          if (angle < -Math.PI / 2) angle += Math.PI;
          const h = 1 * remPx;
          ctx.save();
          ctx.translate(mx, my);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.roundRect(-w / 2, -h / 2, w, h, 0.125 * remPx);
          ctx.fillStyle = cLink;
          ctx.fill();
          ctx.fillStyle = "#FFFFFF";
          ctx.fillText(String(lb.num), 0, 0);
          ctx.restore();
        }
      });

      // 5. 站点标注点(绿色实心圆)
      MAP_MARKERS.forEach((m) => {
        const [x, y] = project(m.lon, m.lat);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = cMarker;
        ctx.fill();
      });

      // 5.5 枢纽标注点(绿色实心圆,连线汇聚处,logo 悬浮其上)
      MAP_HUBS.forEach((hb) => {
        const [x, y] = project(hb.lon, hb.lat);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = cMarker;
        ctx.fill();
      });

      // 6. 枢纽位置输出给 DOM 叠加层
      // 前海:无偏移;嘉定/外高桥:对角偏移 + 最小分离(缩小时推开保证间隙),

      const logoD = 3 * remPx; // logo 直径
      const gapMin = 0.3 * remPx; // 期望间隙
      const dMin = logoD + gapMin;
      const pos = MAP_HUBS.map((hb) => {
        const [x, y] = project(hb.lon, hb.lat);
        return { hb, x, y };
      });
      const jd = pos.find((p) => p.hb.id === "jiading");
      const wg = pos.find((p) => p.hb.id === "waigaoqiao");

      // 模式A:对角偏移(嘉定左上/外高桥右下) + 最小分离推开
      let A1 = { x: jd.x + jd.hb.offsetX * remPx, y: jd.y + jd.hb.offsetY * remPx };
      let A2 = { x: wg.x + wg.hb.offsetX * remPx, y: wg.y + wg.hb.offsetY * remPx };
      let ddx = A2.x - A1.x;
      let ddy = A2.y - A1.y;
      let dist = Math.hypot(ddx, ddy) || 0.001;
      if (dist < dMin) {
        const midX = (A1.x + A2.x) / 2;
        const midY = (A1.y + A2.y) / 2;
        const nx = ddx / dist;
        const ny = ddy / dist;
        A1 = { x: midX - (nx * dMin) / 2, y: midY - (ny * dMin) / 2 };
        A2 = { x: midX + (nx * dMin) / 2, y: midY + (ny * dMin) / 2 };
      }

      // 模式B:logo 严格悬浮于标注点正中心上方(圆下缘贴住点,水平与点居中对齐)
      const lift = logoD / 2;
      const B1 = { x: jd.x, y: jd.y - lift };
      const B2 = { x: wg.x, y: wg.y - lift };

      // zoom 阈值平滑插值(1.8x 起过渡,2.4x 完全到位)
      const z1 = 1.8;
      const z2 = 2.4;
      let tv = (zoom - z1) / (z2 - z1);
      tv = Math.min(Math.max(tv, 0), 1);
      tv = tv * tv * (3 - 2 * tv); // smoothstep
      const lerp = (a, b, k) => a + (b - a) * k;

      const hubPosOf = (p, a, b) => ({
        id: p.hb.id,
        label: p.hb.label,
        x: lerp(a.x, b.x, tv),
        y: lerp(a.y, b.y, tv),
      });
      setHubPos([
        ...pos
          .filter((p) => p.hb.id !== "jiading" && p.hb.id !== "waigaoqiao")
          .map((p) => ({ id: p.hb.id, label: p.hb.label, x: p.x, y: p.y })),
        hubPosOf(jd, A1, B1),
        hubPosOf(wg, A2, B2),
      ]);

      // 7. 南海诸岛附图(右下角,真实九段线 + 台湾/海南轮廓)
      const sw = 88;
      const sh = 64;
      const hainanP = CHINA_PROVINCES.find((p) => p.name === "海南");
      const taiwanP = CHINA_PROVINCES.find((p) => p.name === "台湾");
      drawSouthSea(ctx, w - sw - 10, h - sh - 10, sw, sh, {
        fill: withAlpha(cFill, 0.5),
        border: cLine,
        sea: cText,
        label: cSub,
      }, hainanP ? hainanP.points : null, taiwanP ? taiwanP.points : null);
    };

    redrawRef.current = draw;
    draw();
    const ro = new ResizeObserver(draw);
    ro.observe(wrap);

    // ---------- 地图交互:滚轮缩放(以鼠标为锚点) + 拖拽平移 ----------
    const onWheel = (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const v = viewRef.current;
      const ccx = rect.width / 2;
      const ccy = rect.height / 2;
      const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
      const z2 = Math.min(Math.max(v.zoom * factor, 0.5), 8);
      // 反推鼠标点对应的基础投影坐标,保持缩放锚点地理不动
      const bx = (mx - ccx - v.panX) / v.zoom + ccx;
      const by = (my - ccy - v.panY) / v.zoom + ccy;
      viewRef.current = {
        zoom: z2,
        panX: mx - ccx - (bx - ccx) * z2,
        panY: my - ccy - (by - ccy) * z2,
      };
      draw();
    };

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const onDown = (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.style.cursor = "grabbing";
    };
    const onMove = (e) => {
      if (!dragging) return;
      const v = viewRef.current;
      viewRef.current = {
        ...v,
        panX: v.panX + (e.clientX - lastX),
        panY: v.panY + (e.clientY - lastY),
      };
      lastX = e.clientX;
      lastY = e.clientY;
      draw();
    };
    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      canvas.style.cursor = "grab";
    };

    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);

    return () => {
      ro.disconnect();
      canvas.removeEventListener("wheel", onWheel);
      canvas.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [isDark]);

  // 控制按钮:以画布中心为锚缩放(中心地理位置保持不动);居中重置视图
  const zoomBy = (factor) => {
    const v = viewRef.current;
    const z2 = Math.min(Math.max(v.zoom * factor, 0.5), 8);
    const k = z2 / v.zoom;
    viewRef.current = { zoom: z2, panX: v.panX * k, panY: v.panY * k };
    if (redrawRef.current) redrawRef.current();
  };

  const resetView = () => {
    viewRef.current = { zoom: 1, panX: 0, panY: 0 };
    if (redrawRef.current) redrawRef.current();
  };

  return (
    <div ref={wrapRef} className="china-map">
      <canvas ref={canvasRef} className="china-map-canvas" />
      {/* 右下角视图控制:放大/缩小(连体,分割线隔开) + 居中 */}
      <div className="map-controls">
        <div className="map-zoom-group">
          <button type="button" className="map-ctl-btn" title="放大" aria-label="放大" onClick={() => zoomBy(1.3)}>
            <Icon name="plus" size="1rem" />
          </button>
          <button type="button" className="map-ctl-btn" title="缩小" aria-label="缩小" onClick={() => zoomBy(1 / 1.3)}>
            <Icon name="minus" size="1rem" />
          </button>
        </div>
        <button type="button" className="map-ctl-btn is-single" title="居中" aria-label="居中" onClick={resetView}>
          <Icon name="locate-fixed" size="1rem" />
        </button>
      </div>
      {hubPos.map((hb) => (
        <div key={hb.id} className="map-hub" style={{ left: `${hb.x}px`, top: `${hb.y}px` }}>
          <div className="map-hub-logo" title={hb.label}>
            <Icon name="building-2" size="1.5rem" color="#FFFFFF" />
          </div>
          <span className="map-hub-label">{hb.label}</span>
        </div>
      ))}
    </div>
  );
}
  Object.assign(__export, { ChinaMap });
})();

(function () {
  const { useEffect, useState } = React;
// 逐字打印 hook:
// - enabled 变为 true(或 runKey 变化)时从 0 重新开始,每 30ms 打印 speed 个字符
// - enabled 变回 false 时停止但保留已打印内容(供折叠后再展开查看)
// - done 表示已打印至末尾
function useTypewriter(text, { runKey = 0, speed = 1, enabled = true } = {}) {
  const [count, setCount] = useState(0);

  useEffect(() => {
    if (!enabled) return undefined;
    setCount(0);
    let i = 0;
    const timer = setInterval(() => {
      i += speed;
      if (i >= text.length) {
        i = text.length;
        clearInterval(timer);
      }
      setCount(i);
    }, 30);
    return () => clearInterval(timer);
  }, [text, runKey, speed, enabled]);

  return { shown: text.slice(0, count), done: count >= text.length };
}
  Object.assign(__export, { useTypewriter });
})();

    const later = (fn, ms) => timers.push(setTimeout(fn, ms));

    if (stage === "wait") {
      later(() => setStage("thinking"), 400);
    } else if (stage === "thinking" && think.done) {
      later(() => {
        setThinkOpen(false); // 思考完成自动折叠思考文案
        setStage("thinkDone");
      }, 700);
    } else if (stage === "thinkDone") {
      later(() => setStage("skill"), 500);
    } else if (stage === "skill") {
      later(() => {
        setSkillDone(true);
        setStepIndex(0);
        setStage("steps");
      }, 900);
    } else if (stage === "steps") {
      later(() => {
        setStepIndex(1);
        setStage("orchestrate");
      }, 1100);
    } else if (stage === "orchestrate") {
      later(() => {
        setShowPlanCard(true);
        setStage("plancard");
      }, 900);
    } else if (stage === "plancard") {
      later(() => {
        setShowConfirm(true);
        setStage("confirm"); // 停在这里,等待用户确认
      }, 1000);
    } else if (stage === "runMore") {
      // 与右侧 ChangeFlow 流程组件共用同一条时间线(FLOW_TIMING):
      // 右侧卡片 i 完成时刻 = appearDelay + i*cycle + loadingMs,
      // 每张卡片完成时左侧步骤条同步前进一步,两边同时到达完成/结束
      const cycle =
        FLOW_TIMING.loadingMs + FLOW_TIMING.revealMs + FLOW_TIMING.arrowGapMs;
      const cardDoneAt = (i) =>
        FLOW_TIMING.appearDelay + i * cycle + FLOW_TIMING.loadingMs;
      const totalCards = STEP_ITEMS.length - 2; // 确认后执行的步骤:配置生成/配置审核/结果下发
      later(() => setStepIndex(2), 400); // 开始执行「配置生成」(右侧卡片即将出现)
      for (let i = 0; i < totalCards; i++) {
        later(() => setStepIndex(2 + i + 1), cardDoneAt(i)); // 卡片 i 完成 → 下一步
      }
      later(
        () => {
          setPlanOpen(false); // 与右侧「结束」端子同时,整段折叠进入结果打印
          setStage("result");
        },
        FLOW_TIMING.appearDelay + totalCards * cycle + 200
      );
    } else if (stage === "result" && result.done) {
      setStage("done");
      if (cbRef.current.onDone) cbRef.current.onDone();
    }

    return () => timers.forEach((t) => clearTimeout(t));
  }, [stage, think.done, result.done]);

  const handleConfirm = () => {
    setShowConfirm(false);
    setStage("runMore");
    // 右侧画布由「内容生成中」切换为配置变更流程组件
    launchAiFlow();
  };

  const handleCancel = () => {
    // 未确认时流程停在原地,取消按钮轻微抖动提示
    setCancelShake(true);
    setTimeout(() => setCancelShake(false), 500);
  };

  const handleRefresh = () => {
    setThinkOpen(true);
    setPlanOpen(true);
    setPlanCardOpen(true);
    setSkillDone(false);
    setStepIndex(-1);
    setShowPlanCard(false);
    setShowConfirm(false);
    setCopied(false);
    setVote(0);
    setTypedPlanCount(1);
    setConfirmTyped(false);
    setRunKey((k) => k + 1);
    setStage("wait");
    if (cbRef.current.onRestart) cbRef.current.onRestart();
  };

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(AI_FINAL_RESULT);
    } catch (e) {
      // 剪贴板不可用时静默降级,仍给出已复制反馈
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  // 发送后短暂等待:提示正在接收问题
  if (stage === "wait") {
    return (
      <div className="answer-card">
        <div className="ac-wait">
          <Icon name="loader-circle" size="1rem" className="is-spin" />
          <span>正在接收问题…</span>
        </div>
      </div>
    );
  }

  const thinking = stage === "thinking";

  return (
    <div className="answer-card">
      {/* 一、思考过程(可折叠:思考图标 + 文案 + 折叠图标,打印完成后自动折叠) */}
      <div className="ac-section">
        <button
          type="button"
          className="ac-section-head"
          onClick={() => setThinkOpen((o) => !o)}
          title={thinkOpen ? "折叠思考过程" : "展开思考过程"}
        >
          <span className={thinking ? "ac-lead-icon is-live" : "ac-lead-icon"}>
            <Icon name="brain" size="0.875rem" />
          </span>
          <span className="ac-section-title">
            {thinking ? "思考中" : "已完成思考"}
          </span>
          <span className="ac-head-toggle">
            <Icon
              name={thinkOpen ? "chevron-up" : "chevron-down"}
              size="0.875rem"
            />
          </span>
        </button>
        {thinkOpen ? (
          <div className="ac-think-body">
            <TwBlock shown={think.shown} typing={thinking} />
          </div>
        ) : null}
      </div>

      {/* 二、任务拆解与规划 */}
      {atLeast(stage, "skill") ? (
        <div className="ac-block reveal">
          <div className="ac-block-label">
            <span className="ac-lead-icon is-ok">
              <Icon name="workflow" size="0.875rem" />
            </span>
            <span className="ac-block-name">
              <TwText text="任务拆解与规划" />
            </span>
          </div>

          {/* 第一个小步骤:技能选择匹配【意图分解】(图标 + 逐字打印文案 + 折叠按钮) */}
          <div className="ac-section">
            <button
              type="button"
              className="ac-section-head"
              onClick={() => setPlanOpen((o) => !o)}
              title={planOpen ? "折叠执行详情" : "展开执行详情"}
            >
              <span className="ac-lead-icon">
                <Icon name="puzzle" size="0.875rem" />
              </span>
              <span className="ac-section-title">
                <TwText text="技能选择匹配【意图分解】" />
              </span>
              <span className="ac-head-state">
                {skillDone ? (
                  <Icon name="check" size="0.875rem" className="ac-done" />
                ) : (
                  <Icon
                    name="loader-circle"
                    size="0.875rem"
                    className="is-spin"
                  />
                )}
              </span>
              <span className="ac-head-toggle">
                <Icon
                  name={planOpen ? "chevron-up" : "chevron-down"}
                  size="0.875rem"
                />
              </span>
            </button>
            {planOpen ? (
              <div className="ac-plan-body">
                {atLeast(stage, "steps") ? (
                  <Steps
                    className="ac-steps"
                    direction="vertical"
                    size="small"
                    current={stepIndex}
                    items={STEP_ITEMS}
                  />
                ) : null}

                {/* 总任务规划清单小卡片(标题 + 折叠按钮 + 提示文案 + 逐条打印的清单内容) */}
                {showPlanCard ? (
                  <div className="plan-card">
                    <div className="plan-card-head">
                      <span className="plan-card-title">
                        <Icon name="clipboard-list" size="0.875rem" />
                        <TwText text="总任务规划清单" />
                      </span>
                      <button
                        type="button"
                        className="plan-fold"
                        title={planCardOpen ? "折叠清单" : "展开清单"}
                        onClick={() => setPlanCardOpen((o) => !o)}
                      >
                        <Icon
                          name={planCardOpen ? "chevron-up" : "chevron-down"}
                          size="0.875rem"
                        />
                      </button>
                    </div>
                    <div className="plan-card-hint">
                      <Icon name="circle-check-big" size="0.875rem" />
                      <TwText
                        text="任务编排已完成，清单与规划已生成"
                        speed={2}
                      />
                    </div>
                    {planCardOpen ? (
                      <ol className="plan-list">
                        {AI_TASK_PLAN.map((item, i) => (
                          <li
                            key={item}
                            className={i < typedPlanCount ? "" : "is-hidden"}
                          >
                            <span className="plan-idx">{i + 1}</span>
                            <span>
                              <PlanItemText
                                text={item}
                                active={i < typedPlanCount}
                                onDone={() =>
                                  setTypedPlanCount((c) => Math.max(c, i + 2))
                                }
                              />
                            </span>
                          </li>
                        ))}
                      </ol>
                    ) : null}
                  </div>
                ) : null}
              </div>
            ) : null}
          </div>
        </div>
      ) : null}

      {/* 确认提示:问题逐字打印,打印完成后出现按钮;点击「确认」后流程才继续 */}
      {showConfirm ? (
        <div className={cancelShake ? "ac-confirm is-shake" : "ac-confirm"}>
          <div className="ac-confirm-text">
            <TwText
              text="请确认是否按照总任务规划清单执行？"
              onDone={() => setConfirmTyped(true)}
            />
          </div>
          {confirmTyped ? (
            <div className="ac-confirm-btns">
              <Button type="primary" size="small" onClick={handleConfirm}>
                确认
              </Button>
              <Button size="small" onClick={handleCancel}>
                取消
              </Button>
            </div>
          ) : null}
        </div>
      ) : null}

      {/* 三、最终生成结果(逐字打印 + 蓝色光效) */}
      {atLeast(stage, "result") ? (
        <div className="ac-result">
          <TwBlock shown={result.shown} typing={stage === "result"} />
        </div>
      ) : null}

      {/* 四、底部操作条:左耗时 | 右五图标(刷新/复制/赞/踩/更多) */}
      {stage === "done" ? (
        <div className="ac-footer">
          <span className="ac-cost">
            <Icon name="timer" size="0.75rem" />
            耗时1min50s
          </span>
          <div className="ac-actions">

              type="button"
              className="ac-action"
              title="重新生成"

              <Icon name="refresh-cw" size="0.875rem" />
            </button>
            <button
              type="button"
              className="ac-action"
              title={copied ? "已复制" : "复制结果"}
              onClick={handleCopy}
            >
              <Icon name={copied ? "check" : "copy"} size="0.875rem" />
            </button>
            <button
              type="button"
              className={vote === 1 ? "ac-action is-on" : "ac-action"}

            </button>
            <button

              <Icon name="ellipsis" size="0.875rem" />

}

// 从用户输入提炼简短会话标题:去口语前缀(请/帮我/我想…) → 取首个分句 → 超长截断
function summarizeTitle(text, maxLen = 14) {
  const clean = String(text).replace(/\s+/g, " ").trim();
  if (!clean) return "AI 对话";
  const stripped =
    clean.replace(/^(请|麻烦|帮我|帮忙|我想|我想要|我要|给我)/, "").trim() ||
    clean;
  const firstClause =
    stripped.split(/[，。！？；、:,.!?;\n]/)[0].trim() || stripped;
  return firstClause.length > maxLen
    ? `${firstClause.slice(0, maxLen)}…`
    : firstClause;
}

// 用于按时间线驱动「加载中 → 校验完成」的状态切换
function useElapsed(run) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    if (!run) {
      setElapsed(0);
      return undefined;
    }
    const start = performance.now();
    const id = setInterval(() => setElapsed(performance.now() - start), 80);
    return () => clearInterval(id);
  }, [run]);
  return elapsed;
}

function splitParam(p) {
  const dot = p.indexOf(".");
  if (dot === -1) return { type: "", content: p };
  return { type: p.slice(0, dot + 1), content: p.slice(dot + 1) };
}

}

  const [hiddenCount, setHiddenCount] = useState(0);
  const [showMore, setShowMore] = useState(false);
  const [popupPos, setPopupPos] = useState({ top: 0, right: 0 });
  // 异常动作标签的悬浮提示(portal 渲染到 body,不受卡片 overflow 裁剪)
  const [abnormalTip, setAbnormalTip] = useState(false);
  const [abnormalTipPos, setAbnormalTipPos] = useState({ top: 0, left: 0 });

  const toggleMore = () => {
    if (!showMore && moreBtnRef.current) {
      const rect = moreBtnRef.current.getBoundingClientRect();
      setPopupPos({
        top: rect.bottom + 8,
        right: window.innerWidth - rect.right,
      });
    }
    setShowMore(!showMore);
  };

  // 异常动作标签 hover:定位到标签正上方居中
  const abnormal = step.actionAbnormal;
  const handleAbnormalEnter = () => {
    if (!abnormal || !actionTagRef.current) return;
    const rect = actionTagRef.current.getBoundingClientRect();
    setAbnormalTipPos({ top: rect.top, left: rect.left + rect.width / 2 });
    setAbnormalTip(true);
  };
  const handleAbnormalLeave = () => setAbnormalTip(false);

  useLayoutEffect(() => {
    const container = tagsRef.current;
    if (!container || !params.length || !showParams) return undefined;

    const measure = () => {
      const maxWidth = container.clientWidth;
      const gap = 6;
      // 排除 "+N" 标签,仅测量动作标签 + 参数标签
      const nodes = Array.from(
        container.querySelectorAll(".cf-tag")
      ).filter((n) => !n.classList.contains("cf-tag--more"));
      const actionW = nodes[0] ? nodes[0].offsetWidth : 0;
      const paramWs = nodes.slice(1).map((n) => n.offsetWidth);

      const countFit = (moreReserve) => {
        let used = actionW + (moreReserve > 0 ? gap + moreReserve : 0);
        let visible = 0;
        for (let i = 0; i < paramWs.length; i++) {
          if (used + gap + paramWs[i] <= maxWidth) {
            used += gap + paramWs[i];
            visible++;
          } else break;
        }
        return visible;
      };

      let visible = countFit(0);
      if (visible < params.length) {
        visible = countFit(30); // 预留 "+N" 标签约 30px,避免其被裁剪
      }
      setHiddenCount(Math.max(0, params.length - visible));
    };

    measure();
    // 字体加载后重新测量(字体未加载时宽度不准,可能导致标签溢出)
    if (
      typeof document !== "undefined" &&
      document.fonts &&
      document.fonts.ready
    ) {
      document.fonts.ready.then(measure);
    }
    return undefined;
  }, [params, step.action, showAction, showParams]);

  const visibleCount = Math.max(0, params.length - hiddenCount);
  const visibleParams = params.slice(0, visibleCount);
  const hiddenParams = params.slice(visibleCount);

  return (
    <div
      className={`cf-card-outer ${
        showLoading ? "cf-card-outer--loading" : ""
      } ${fading ? "cf-card-outer--fading" : ""} cf-anim`}
      style={{ animationDelay: `${delay}s` }}
    >
      <div
        className={`cf-card ${stateClass} ${
          selected ? "cf-card--selected" : ""
        } ${fading ? "cf-card--fading" : ""}`}
        onClick={() => onSelect && onSelect(index)}
      >
        <div className="cf-card-header">
          <span className="cf-card-title">
            {step.no != null ? (
              <span className="cf-card-index">
                {String(step.no).indexOf(".") >= 0 ? step.no : `${step.no}.`}
              </span>
            ) : null}
            {step.title}
          </span>
          <div className="cf-card-header-right">
            {loading ? (
              <span className="cf-loading-indicator" />
            ) : (
              <span className="cf-detail-icon" title="查看详情">
                <Icon
                  name="file-text"
                  size="0.875rem"
                  color={selected ? "#3b82f6" : "#DFDFDF"}
                />
              </span>
            )}
          </div>
        </div>
        {showAction && step.action ? (
          <div className="cf-tags" ref={tagsRef}>
            <span
              ref={actionTagRef}
              className={`cf-tag cf-tag--action ${
                abnormal ? "cf-tag--abnormal" : ""
              } cf-tag-load`}
              onMouseEnter={abnormal ? handleAbnormalEnter : undefined}
              onMouseLeave={abnormal ? handleAbnormalLeave : undefined}
            >
              <Icon
                name={abnormal ? "triangle-alert" : step.actionIcon || "circle-dot"}
                size="0.75rem"
                color={abnormal ? "#f87171" : "#cb8efb"}
                strokeWidth={1.5}
                className="cf-tag-icon"
              />
              {step.action}
            </span>
            {showParams
              ? visibleParams.map((p, i) => (
                  <ParamTag key={i} value={p} animated delay={i * 0.15} />
                ))
              : null}
            {showParams && hiddenCount > 0 ? (
              <button
                ref={moreBtnRef}
                className="cf-tag cf-tag--more cf-tag-load"
                onClick={(e) => {
                  e.stopPropagation();
                  toggleMore();
                }}
              >
                +{hiddenCount}
                <Icon
                  name="chevron-down"
                  size="0.75rem"
                  className="cf-tag-more-icon"
                />
              </button>
            ) : null}
          </div>
        ) : null}
        {showLoading ? <div className="cf-card-glow" /> : null}
        <div className="cf-card-dots" />
      </div>
      {showMore && hiddenCount > 0 ? (
        <div
          className="cf-tag-popup"
          style={{ top: popupPos.top, right: popupPos.right }}
        >
          {hiddenParams.map((p, i) => (
            <ParamTag key={i} value={p} />
          ))}
        </div>
      ) : null}
      {abnormalTip ? (
        <div
          className="cf-abnormal-tip"
          style={{ top: abnormalTipPos.top, left: abnormalTipPos.left }}
        >
          匹配到多个重复动作包，请人工确认选择
        </div>
      ) : null}
    </div>
  );
}

// 详情行:标签 + 内容
function DetailRow({ label, children }) {
  return (
    <div className="cf-drawer-row">
      <span className="cf-drawer-label">{label}</span>
      <div className="cf-drawer-value">{children}</div>
    </div>
  );
}

// 单节点详情侧边栏:节点名称 / 匹配动作 / 匹配参数 / 关联参数命令行
function DetailPanel({ step, onClose }) {
  if (!step) return null;
  const params = step.params || [];
  return (
    <div className="cf-drawer-panel">
      <div className="cf-drawer-header">
        <span className="cf-drawer-title">{step.title}</span>
        <button
          className="cf-drawer-close"
          type="button"
          onClick={onClose}
          aria-label="关闭"
        >
          <Icon name="x" size="1rem" color="#DFDFDF" />
        </button>
      </div>
      <div className="cf-drawer-body">
        <DetailRow label="匹配动作">
          <span className="cf-tag cf-tag--action">
            <Icon
              name={step.actionIcon || "circle-dot"}
              size="0.75rem"
              color="#cb8efb"
              strokeWidth={1.5}
              className="cf-tag-icon"
            />
            {step.action}
          </span>
        </DetailRow>
        <DetailRow label="匹配参数">
          {params.length ? (
            <div className="cf-drawer-params">
              {params.map((p, i) => (
                <ParamTag key={i} value={p} />
              ))}
            </div>
          ) : (
            <span className="cf-drawer-text cf-drawer-text--muted">—</span>
          )}
        </DetailRow>
        <div className="cf-drawer-row">
          <div className="cf-drawer-label-row">
            <span className="cf-drawer-label">关联命令行</span>
            {step.commandLine ? (
              <button
                className="cf-drawer-copy"
                type="button"
                onClick={() => {
                  const text = step.commandLine || "";
                  if (
                    typeof navigator !== "undefined" &&
                    navigator.clipboard
                  ) {
                    navigator.clipboard.writeText(text);
                  }
                }}
                aria-label="复制"
              >
                <Icon name="copy" size="0.875rem" color="#C9C9C9" />
              </button>
            ) : null}
          </div>
          <div className="cf-drawer-value">
            <pre className="cf-drawer-code">{step.commandLine || "—"}</pre>
          </div>
        </div>
      </div>
    </div>
  );
}

// 配置变更流程组件:纵向流程图,步骤卡片依次加载(流光边框),
// 支持条件分支、点击选中(详情侧边栏)、视图缩放
// 时间线常量取自 FLOW_TIMING(与左侧 AI 问答步骤条联动共用同一节奏)
function ChangeFlow(props) {
  const steps = props.steps || [];
  const autoPlay = props.autoPlay !== false;
  const loadingMs =
    props.loadingMs != null ? props.loadingMs : FLOW_TIMING.loadingMs;
  const elapsed = useElapsed(autoPlay);

  // 选中态:支持受控(selectedIndex)与非受控(内部状态 + 点击切换)
  const [internalSelected, setInternalSelected] = useState(null);
  const selectedIndex =
    props.selectedIndex != null ? props.selectedIndex : internalSelected;

  // 节点详情侧边栏
  const [detailNode, setDetailNode] = useState(null);
  const [detailOpen, setDetailOpen] = useState(false);
  const closeDetail = () => {
    setDetailOpen(false);
    if (props.selectedIndex == null) setInternalSelected(null);
    if (props.onSelect) props.onSelect(null);
  };
  const selectAndOpen = (i, step) => {
    if (props.selectedIndex == null) setInternalSelected(i);
    if (props.onSelect) props.onSelect(i);
    setDetailNode(step);
    setDetailOpen(true);
  };
  const handleSelect = (i) => selectAndOpen(i, steps[i]);

  // 视图缩放
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 1.5;
  const ZOOM_STEP = 0.1;
  const [zoom, setZoom] = useState(1);
  const zoomIn = () =>
    setZoom((z) => Math.min(ZOOM_MAX, Math.round((z + ZOOM_STEP) * 10) / 10));
  const zoomOut = () =>
    setZoom((z) => Math.max(ZOOM_MIN, Math.round((z - ZOOM_STEP) * 10) / 10));

  const actions = props.actions || DEFAULT_ACTIONS;

  // 顺序出现:上一张卡片「全部加载完成(含状态揭示)」后,箭头淡入,再轮到下一张
  const APPEAR_DELAY_MS = FLOW_TIMING.appearDelay;
  const STATUS_REVEAL_MS = FLOW_TIMING.revealMs;
  const ARROW_GAP_MS = FLOW_TIMING.arrowGapMs;
  const FADE_OUT_MS = 450;
  const cycleMs = loadingMs + STATUS_REVEAL_MS + ARROW_GAP_MS;
  const endDelay = autoPlay
    ? (APPEAR_DELAY_MS + steps.length * cycleMs) / 1000
    : 0.7 + steps.length * 0.5;
  const flowDoneMs =
    APPEAR_DELAY_MS +
    Math.max(0, steps.length - 1) * cycleMs +
    loadingMs +
    FADE_OUT_MS;
  const flowLoading = autoPlay && elapsed < flowDoneMs;

  return (
    <div className={`cf ${props.theme === "light" ? "cf--light" : ""}`}>
      <header className="cf-topbar cf-anim" style={{ animationDelay: "0.1s" }}>
        <div className="cf-topbar-left">
          <div className="cf-topbar-icon">
            <Icon
              name={props.headerIcon || "clipboard-list"}
              size="0.875rem"
              color="#ffffff"
            />
          </div>
          <span className="cf-topbar-title">
            {props.title || "网络变更-配置详情"}
          </span>
        </div>
        <div className="cf-topbar-right">
          {actions.map((a, i) => (
            <button key={i} className="cf-btn" type="button">
              <Icon name={a.icon} size="0.875rem" />
              {a.label}
            </button>
          ))}
        </div>
      </header>

      <main className="cf-flow" style={{ transform: `scale(${zoom})` }}>
        <div className="cf-terminal cf-anim" style={{ animationDelay: "0.3s" }}>
          {props.startLabel || "开始"}
        </div>
        <div
          className={`cf-arrow ${
            flowLoading ? "cf-arrow--loading" : ""
          } cf-anim`}
          style={{ animationDelay: "0.4s" }}
        />
        {steps.map((step, i) => {
          const appearAt = APPEAR_DELAY_MS + i * cycleMs;
          const doneAt = appearAt + loadingMs;
          const arrowAt = doneAt + STATUS_REVEAL_MS;
          const loading = autoPlay && elapsed < doneAt;
          const fading = autoPlay && !loading && elapsed < doneAt + FADE_OUT_MS;
          const cardDelay = autoPlay ? appearAt / 1000 : 0.5 + i * 0.5;
          const arrowDelay = autoPlay ? arrowAt / 1000 : 0.7 + i * 0.5;
          // 三阶段加载:初始仅标题 → 加载动作标签 → 加载参数标签
          const actionAt = appearAt + loadingMs * 0.33;
          const paramsAt = appearAt + loadingMs * 0.66;
          const showAction =
            props.showAction != null
              ? props.showAction
              : !autoPlay || elapsed >= actionAt;
          const showParams =
            props.showParams != null
              ? props.showParams
              : !autoPlay || elapsed >= paramsAt;
          // 分支节点:判断条件 + 多条分支
          if (step.type === "branch") {
            return (
              <Fragment key={i}>
                <div
                  className="cf-branch cf-anim"
                  style={{ animationDelay: `${cardDelay}s` }}
                >
                  <FlowCard
                    step={{
                      title: step.condition,
                      action: step.action,
                      params: step.params,
                      commandLine: step.commandLine,
                      no: step.no,
                    }}
                    index={i}
                    loading={loading}
                    fading={fading}
                    delay={cardDelay}
                    selected={false}
                    onSelect={() =>
                      selectAndOpen(i, {
                        title: step.condition,
                        action: step.action,
                        params: step.params,
                        commandLine: step.commandLine,
                      })
                    }
                    showAction={showAction}
                    showParams={showParams}
                  />
                  <div
                    className="cf-branch-fork cf-anim"
                    style={{ animationDelay: `${cardDelay + 0.1}s` }}
                  >
                    <svg viewBox="0 0 840 50" preserveAspectRatio="none">
                      <path d="M420,0 V20 Q420,35 405,35 H215 Q200,35 200,50" />
                      <path d="M420,0 V20 Q420,35 435,35 H625 Q640,35 640,50" />
                    </svg>
                    {step.branches.map((b, bi) => (
                      <span
                        key={bi}
                        className={`cf-branch-label ${
                          bi === 0
                            ? "cf-branch-label--left"
                            : "cf-branch-label--right"
                        }`}
                      >
                        {b.label}
                      </span>
                    ))}
                  </div>
                  <div className="cf-branch-cols">
                    {step.branches.map((b, bi) => (
                      <FlowCard
                        key={bi}
                        step={b.step}
                        index={i}
                        loading={loading}
                        fading={fading}
                        delay={cardDelay + 0.4 + bi * 0.2}
                        selected={false}
                        onSelect={() => selectAndOpen(i, b.step)}
                        showAction={showAction}
                        showParams={showParams}
                      />
                    ))}
                  </div>
                  <div
                    className="cf-branch-join cf-anim"
                    style={{ animationDelay: `${arrowDelay - 0.1}s` }}
                  >
                    <svg viewBox="0 0 840 50" preserveAspectRatio="none">
                      <path d="M200,0 V20 Q200,35 215,35 H405 Q420,35 420,50" />
                      <path d="M640,0 V20 Q640,35 625,35 H435 Q420,35 420,50" />
                    </svg>
                  </div>
                </div>
                <div
                  className={`cf-arrow ${
                    flowLoading ? "cf-arrow--loading" : ""
                  } cf-anim`}
                  style={{ animationDelay: `${arrowDelay}s` }}
                />
              </Fragment>
            );
          }
          return (
            <Fragment key={i}>
              <FlowCard
                step={step}
                index={i}
                loading={loading}
                fading={fading}
                delay={cardDelay}
                selected={selectedIndex === i}
                onSelect={handleSelect}
                showAction={showAction}
                showParams={showParams}
              />
              <div
                className={`cf-arrow ${
                  flowLoading ? "cf-arrow--loading" : ""
                } cf-anim`}
                style={{ animationDelay: `${arrowDelay}s` }}
              />
            </Fragment>
          );
        })}
        <div
          className="cf-terminal cf-anim"
          style={{ animationDelay: `${endDelay}s` }}
        >
          {props.endLabel || "结束"}
        </div>
      </main>
      <div className="cf-zoom">
        <button
          className="cf-zoom-btn"
          type="button"
          onClick={zoomIn}
          disabled={zoom >= ZOOM_MAX}
          aria-label="放大"
        >
          <Icon name="plus" size="0.875rem" />
        </button>
        <button
          className="cf-zoom-btn"
          type="button"
          onClick={zoomOut}
          disabled={zoom <= ZOOM_MIN}
          aria-label="缩小"
        >
          <Icon name="minus" size="0.875rem" />
        </button>
      </div>

      <div className={`cf-drawer ${detailOpen ? "cf-drawer--open" : ""}`}>
        <DetailPanel step={detailNode} onClose={closeDetail} />
      </div>
    </div>
  );
}
  Object.assign(__export, { ChangeFlow });
})();

}

})();

(function () {
  const { useState } = React;
  const { Button, Input, InputNumber, Switch, message } = antd;
// Layer 4: 系统设置 — H5 表单骨架(标签居左) + 开关设置行
const DEFAULT_FORM = {
  systemName: "iMaster NCE-Campus",
  adminEmail: "admin@example.com",
  pollInterval: 30,
  soundAlarm: true,
  emailNotify: true,
  smsNotify: false,
};

function SettingsView() {
  const [form, setForm] = useState(DEFAULT_FORM);
  const [errors, setErrors] = useState({});

  const setField = (key, value) => {
    setForm((f) => ({ ...f, [key]: value }));
    setErrors((e) => ({ ...e, [key]: undefined }));
  };

  const handleSave = () => {
    const next = {};
    if (!form.systemName.trim()) {
      next.systemName = "请输入系统名称";
    }
    if (!form.adminEmail.trim()) {
      next.adminEmail = "请输入管理员邮箱";
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.adminEmail)) {
      next.adminEmail = "邮箱格式不正确";
    }
    if (form.pollInterval === null || form.pollInterval === undefined) {
      next.pollInterval = "请输入轮询间隔";
    } else if (form.pollInterval < 5 || form.pollInterval > 3600) {
      next.pollInterval = "取值范围 5 - 3600 秒";
    }
    setErrors(next);
    if (Object.keys(next).length === 0) {
      message.success("系统设置已保存");
    }
  };

  const handleCancel = () => {
    setForm(DEFAULT_FORM);
    setErrors({});
  };

  return (
    <div className="settings-view">
      <section className="settings-card">
        <h3 className="settings-card-title">基本设置</h3>
        <div className="settings-grid">
          <label className="form-label required" htmlFor="set-name">系统名称</label>
          <div className="form-field">
            <Input
              id="set-name"
              style={{ width: "24rem" }}
              status={errors.systemName ? "error" : undefined}
              value={form.systemName}
              onChange={(e) => setField("systemName", e.target.value)}
              placeholder="请输入系统名称"
            />
            {errors.systemName && <div className="form-error">{errors.systemName}</div>}
          </div>

          <label className="form-label required" htmlFor="set-email">管理员邮箱</label>
          <div className="form-field">
            <Input
              id="set-email"
              style={{ width: "24rem" }}
              status={errors.adminEmail ? "error" : undefined}
              value={form.adminEmail}
              onChange={(e) => setField("adminEmail", e.target.value)}
              placeholder="name@example.com"
            />
            {errors.adminEmail && <div className="form-error">{errors.adminEmail}</div>}
          </div>

          <label className="form-label" htmlFor="set-interval">轮询间隔</label>
          <div className="form-field">
            <span className="form-inline">
              <InputNumber
                id="set-interval"
                mode="spinner"
                variant="outlined"
                style={{ width: "8rem" }}
                min={5}
                max={3600}
                value={form.pollInterval}
                onChange={(v) => setField("pollInterval", v)}
                placeholder="30"
              />
              <span className="form-unit">秒</span>
            </span>
            {errors.pollInterval && <div className="form-error">{errors.pollInterval}</div>}
          </div>
        </div>
      </section>

      <section className="settings-card">
        <h3 className="settings-card-title">告警通知</h3>
        <div className="switch-row">
          <div className="switch-text">
            <span className="switch-label">告警声音提醒</span>
            <span className="switch-desc">产生紧急/重要告警时在控制台播放提示音</span>
          </div>
          <Switch checked={form.soundAlarm} onChange={(v) => setField("soundAlarm", v)} />
        </div>
        <div className="switch-row">
          <div className="switch-text">
            <span className="switch-label">邮件通知</span>
            <span className="switch-desc">新告警产生时发送邮件至管理员邮箱</span>
          </div>
          <Switch checked={form.emailNotify} onChange={(v) => setField("emailNotify", v)} />
        </div>
        <div className="switch-row">
          <div className="switch-text">
            <span className="switch-label">短信通知</span>
            <span className="switch-desc">紧急告警产生时发送短信至值班手机（需配置网关）</span>
          </div>
          <Switch checked={form.smsNotify} onChange={(v) => setField("smsNotify", v)} />
        </div>
      </section>

      <div className="settings-actions">
        <Button onClick={handleCancel}>取消</Button>
        <Button type="primary" onClick={handleSave}>保存</Button>
      </div>
    </div>
  );
}
  Object.assign(__export, { SettingsView });
})();

(function () {
  const { useApp, SYNCED_FLOW_STEPS } = __export;
  const SessionCard = __export.SessionCard;
  const OverviewView = __export.OverviewView;
  const AiChat = __export.AiChat;
  const ContentGen = __export.ContentGen;
  const ChangeFlow = __export.ChangeFlow;
  const DeviceView = __export.DeviceView;
  const AlarmView = __export.AlarmView;
  const SettingsView = __export.SettingsView;
// Layer 4: 菜单内容区 — 按当前激活菜单项渲染对应视图
// 首页:左侧会话卡片(33.75rem × 100%,贴边) + 右侧地图自适应
// AI:左侧 AI 会话卡片(33.75rem × 100%,贴边) + 右侧生成画布(发送后出现)
const VIEW_MAP = {
  devices: DeviceView,
  alarms: AlarmView,
  settings: SettingsView,
};

function ContentArea() {
  const { activeMenu, aiChatActive, aiFlowRunId } = useApp();

  if (activeMenu === "overview") {
    return (
      <main className="content-area is-overview">
        <SessionCard />
        <div className="overview-aside">
          <OverviewView />
        </div>
      </main>
    );
  }

  if (activeMenu === "ai") {
    // 右侧画布:发送后「内容生成中」→ 点击确认后切换为配置变更流程组件
    // 步骤与左侧步骤条同内容(配置生成/配置审核/结果下发),共用 FLOW_TIMING 时间线联动;
    // key=aiFlowRunId:再次确认时重新挂载,流程动画与左侧同步重放
    const canvas =
      aiFlowRunId > 0 ? (
        <ChangeFlow key={aiFlowRunId} steps={SYNCED_FLOW_STEPS} />
      ) : (
        <ContentGen />
      );
    return (
      <main className="content-area is-overview">
        <AiChat />
        {/* 右侧画布容器带 dark 类:固定深色(含发送前空态),与 AI 面板一致 */}
        <div className="overview-aside ai-canvas dark">
          {aiChatActive ? canvas : null}
        </div>
      </main>
    );
  }

  const ActiveView = VIEW_MAP[activeMenu] || DeviceView;
  return (
    <main className="content-area">
      <ActiveView />
    </main>
  );
}
  Object.assign(__export, { ContentArea });
})();
