<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
  <!-- Aico 五色石:五边形宝石,五面五色(紫/蓝/青/绿/黄) -->
  <polygon points="30,4 52,20 44,52 16,52 8,20" fill="#7C3AED"/>
  <polygon points="30,4 52,20 30,30" fill="#7C3AED"/>
  <polygon points="52,20 44,52 30,30" fill="#2563EB"/>
  <polygon points="44,52 16,52 30,30" fill="#06B6D4"/>
  <polygon points="16,52 8,20 30,30" fill="#10B981"/>
  <polygon points="8,20 30,4 30,30" fill="#F59E0B"/>
  <!-- 顶部高光 -->
  <polygon points="25,10 35,12 30,22" fill="#FFFFFF" fill-opacity="0.38"/>
  <!-- 外轮廓 -->
  <polygon points="30,4 52,20 44,52 16,52 8,20" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" fill="none"/>
</svg>
